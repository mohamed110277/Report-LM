<style>
:root{
  --ink:#1c1f26; --sub:#5b6371; --line:#cdd1d8; --bg:#dcdfe4; --card:#eceef1;
  --blue:#2f5ee0; --green:#1a9c6b; --red:#d1394a; --orange:#e08a1f;
  --track:#dde0e6; --grid:#d2d6dc; --hover:#e1e4ea; color-scheme:light; --heat:47,94,224;
}
:root[data-theme="dark"]{
  --ink:#e8eaef; --sub:#9aa3b2; --line:#2e343e; --bg:#13161b; --card:#1c2027;
  --blue:#6b8cff; --green:#34c58f; --red:#ef6676; --orange:#f0a24a;
  --track:#2a303a; --grid:#2a303a; --hover:#252b34; color-scheme:dark; --heat:107,140,255;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;}
button{font-family:inherit;}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--card);border-inline-end:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.brand{font-size:17px;font-weight:800;padding:2px 10px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
.brand img{display:block;height:auto;}
.brand img,.brand span{animation:glowblink 2.2s ease-in-out infinite;}
.brand span{animation-delay:.15s;}
@keyframes glowblink{
  0%,100%{opacity:1;filter:drop-shadow(0 0 7px rgba(230,40,70,.75));}
  50%{opacity:.18;filter:drop-shadow(0 0 0 rgba(230,40,70,0));}
}
@media (prefers-reduced-motion:reduce){ .brand img,.brand span{animation:none;} }
.navl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:700;padding:6px 10px;}
.nav{border:0;background:transparent;color:var(--sub);display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:start;width:100%;}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.nav:hover{background:var(--hover);color:var(--ink);}
.nav.active{background:var(--blue);color:#fff;}
.nav .chev{margin-inline-start:auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;}
.nav .chev:hover{background:rgba(127,127,127,.2);}
.nav .chev svg{width:14px;height:14px;transition:transform .15s;}
.nav .chev.open svg{transform:rotate(180deg);}
.nav.subnav{padding:8px 12px 8px 40px;font-size:13px;}
.nav.subnav::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;margin-inline-start:-14px;flex:none;}
.main{padding:26px 24px 60px;min-width:0;max-width:1400px;width:100%;margin:0 auto;}
h1{font-size:23px;margin:0 0 4px;}
.sub{color:var(--sub);font-size:13.5px;margin:0 0 22px;}
.topbar{margin-bottom:6px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;}
.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--sub);background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:20px;max-width:100%;}
.status .dot{width:9px;height:9px;border-radius:50%;background:#9aa1ad;flex:none;}
.status.live{color:var(--green);} .status.live .dot{background:var(--green);animation:pulse 2s infinite;}
.status.stale,.status.offline{color:var(--orange);} .status.stale .dot,.status.offline .dot{background:var(--orange);}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(26,156,107,.5);}70%{box-shadow:0 0 0 7px rgba(26,156,107,0);}100%{box-shadow:0 0 0 0 rgba(26,156,107,0);}}
.refbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.refbtn:hover{background:var(--track);}
.dlbtn{border:none;background:var(--green);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.dlbtn:disabled{opacity:.5;cursor:not-allowed;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
.hubkpis{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:28px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-inline-start:4px solid var(--c,#333);min-width:0;}
.kpi .label{font-size:13px;color:var(--sub);font-weight:700;}
.hubkpis .kpi .label{font-size:14px;color:var(--green);}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;}
.kpi .note{font-size:12px;color:var(--sub);margin-top:4px;}
.up{color:var(--green);font-weight:700;} .dn{color:var(--red);font-weight:700;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0;}
.panel h2{font-size:15px;margin:0 0 3px;}
.panel .cap{font-size:12.5px;color:var(--sub);margin:0 0 12px;}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin-bottom:16px;}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-bottom:16px;}
.chart{width:100%;position:relative;}
.chart svg{display:block;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-bottom:8px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

const PAGES = [

function fmt(n){return Number(n).toLocaleString('en-US');}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function isDate(s){ return typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function dl(iso){ return MON[+iso.slice(5,7)-1]+' '+(+iso.slice(8,10)); }
function nn(v){ if(typeof v==='number') return v; if(v==null) return NaN; const s=String(v).replace(/[,\s%]/g,''); if(s===''||s==='-') return NaN; return Number(s); }
function fin(v){ return typeof v==='number' && isFinite(v); }
function nrm(v){ return String(v==null?'':v).toLowerCase().replace(/\s+/g,''); }
function pctStr(v){ if(typeof v==='number') return Math.round(Math.abs(v)<=1.5? v*100 : v)+'%'; return String(v==null?'':v).trim(); }
function sum(a){ return a.reduce((x,y)=>x+(fin(y)?y:0),0); }
function last(a){ return a[a.length-1]; }
function signed(v,d=0){ const s=Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:d}); return (v>0?'+':v<0?'−':'')+s; }
function deltaHtml(v,goodUp=true,d=0){ if(!fin(v)||v===0) return '<span class="up" style="color:var(--sub)">0</span>'; const good=(v>0)===goodUp; return `<span class="${good?'up':'dn'}">${v>0?'▲':'▼'} ${signed(Math.abs(v),d).replace('+','')}</span>`; }

// ================= Parsers (rows = array of arrays) =================
function parseHubs(rows){
  const hi = rows.findIndex(r=>nrm(r[0])==='hubname');
  if(hi<0) throw new Error('hub header not found');
  const head = rows[hi].map(nrm);
  const col = (...names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const ix = {target:col('target'), stars:col('totalstars'), active:col('activestar','activestars'), absence:col('absence'),
    absencePct:col('absence%'), ofd:col('ofd'), ofdPerStar:col('ofd/star'), stdOfd:col('standerdofd','standardofd'), missing:col('missingoftarget')};
  for(const k in ix){ if(ix[k]<0) throw new Error('missing column: '+k); }
  const hubs=[];
  for(const r of rows.slice(hi+1)){
    const name=String(r[0]==null?'':r[0]).trim();
    if(!name) break;
    const target=nn(r[ix.target]); if(!fin(target)) continue;
    const active=nn(r[ix.active]), absence=nn(r[ix.absence]);
    hubs.push({hub:name,target,stars:nn(r[ix.stars]),active,absence,
      absencePct: r[ix.absencePct]!=null && r[ix.absencePct]!=='' ? pctStr(r[ix.absencePct]) : (active? Math.round(absence/active*100)+'%':'0%'),
      ofd:nn(r[ix.ofd]),ofdPerStar:nn(r[ix.ofdPerStar]),stdOfd:nn(r[ix.stdOfd]),missing:nn(r[ix.missing])});
  }
  let totals=null;
  const tr = hi>0 ? rows[hi-1] : null;
  if(tr && fin(nn(tr[ix.target]))){
    totals={target:nn(tr[ix.target]),stars:nn(tr[ix.stars]),active:nn(tr[ix.active]),absence:nn(tr[ix.absence]),
      absencePct:pctStr(tr[ix.absencePct]),ofd:nn(tr[ix.ofd]),ofdPerStar:nn(tr[ix.ofdPerStar]),stdOfd:nn(tr[ix.stdOfd]),missing:nn(tr[ix.missing])};
  } else {
    const s=k=>sum(hubs.map(h=>h[k]));
    totals={target:s('target'),stars:s('stars'),active:s('active'),absence:s('absence'),absencePct:(s('active')?Math.round(s('absence')/s('active')*100):0)+'%',
      ofd:s('ofd'),ofdPerStar:s('stars')?Math.round(s('ofd')/s('stars')):0,stdOfd:hubs.length?Math.round(s('stdOfd')/hubs.length):0,missing:s('missing')};
  }
  if(!hubs.length) throw new Error('no hubs');
  let side={}; try{ side=parseSide(rows); }catch(e){ console.warn('side tables:',e); }
  return {hubs,totals,side};
}
function parseSide(rows){
  const out=[];
  for(let r=0;r<rows.length;r++){
    const row=rows[r];
    for(let c=10;c<row.length;c++){
      if(nrm(row[c])!=='hubname') continue;
      const names=[]; for(let k=c;k<row.length&&row[k]!=null&&row[k]!=='';k++) names.push(String(row[k]).trim());
      const hubs=[];
      for(let i=r+1;i<rows.length;i++){ const nm=rows[i][c]; if(nm==null||String(nm).trim()==='') break;
        hubs.push({name:String(nm).trim(),vals:names.slice(1).map((_,j)=>nn(rows[i][c+1+j]))}); }
      const sr=rows[r-1]||[], tr=rows[r-2]||[];
      out.push({title:String(tr[c]||''),cols:names.slice(1),hubs,sumLabel:String(sr[c]||''),sum:names.slice(1).map((_,j)=>nn(sr[c+1+j]))});
    }
  }
  const t1=out.find(t=>t.cols.some(x=>nrm(x)==='ofd/star'));
  const t3=out.find(t=>/stand/i.test(t.title)) || (out.length>=3?out[2]:undefined);
  const t2=out.find(t=>t!==t1&&t!==t3);
  return {ofd:t1,stars:t2,std:t3};
}
function parseSeries(rows){
  const pts=[];
  for(const r of rows){ if(isDate(r[0])){ const v=nn(r[1]); if(fin(v)) pts.push({d:r[0],v}); } }
  if(!pts.length) throw new Error('no data');
  return pts;
}
function parseAcq(rows){
  const hi = rows.findIndex(r=>r.slice(2).some(isDate));
  if(hi<0) throw new Error('date header not found');
  const head=rows[hi]; const cols=[]; head.forEach((c,i)=>{ if(i>=2 && isDate(c)) cols.push(i); });
  const dates=cols.map(i=>head[i]); const hubs=[]; let total=null;
  for(const r of rows.slice(hi+1)){
    const name=String(r[0]==null?'':r[0]).trim(); if(!name) continue;
    const daily=cols.map(i=>{const v=nn(r[i]); return fin(v)?v:0;});
    let month=nn(r[1]); if(!fin(month)) month=sum(daily);
    const rec={name,month,daily};
    if(/^total$/i.test(name)) total=rec; else hubs.push(rec);
  }
  if(!total) total={name:'Total',month:sum(hubs.map(h=>h.month)),daily:dates.map((_,i)=>sum(hubs.map(h=>h.daily[i])))};
  return {dates,total,hubs};
}
function parseDays(rows){
  const hi = rows.findIndex(r=>nrm(r[0])==='hubname');
  if(hi<0) throw new Error('header not found');
  const head=rows[hi]; let cols=[]; head.forEach((c,i)=>{ if(i>=1 && isDate(c)) cols.push(i); });
  const body=[]; for(const r of rows.slice(hi+1)){ const name=String(r[0]==null?'':r[0]).trim(); if(name) body.push({name,r}); }
  cols = cols.filter(i=>body.some(b=>fin(nn(b.r[i]))));
  const top={}; rows.slice(0,hi).forEach(r=>{ const k=nrm(r[0]); if(k) top[k]=cols.map(i=>nn(r[i])); });
  const hubs=body.map(b=>({name:b.name,vals:cols.map(i=>nn(b.r[i]))}));
  if(!cols.length||!hubs.length) throw new Error('no data');
  return {dates:cols.map(i=>head[i]),ofdStar:top['ofd/star']||[],ofd:top['ofd']||[],bosta:top['totalbosta']||[],hubs};
}
function parseTarget(rows){
  const hi = rows.findIndex(r=>nrm(r[0])==='region');
  if(hi<0) throw new Error('header not found');
  const head=rows[hi].map(nrm);
  const ix=(...names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const c={region:ix('region'),sup:ix('superviser','supervisor'),sen:ix('senior'),hub:ix('hubname'),target:ix('taregt','target'),miss:ix('missing'),ofd:ix('ofd/star')};
  if(c.hub<0||c.target<0||c.miss<0) throw new Error('missing columns');
  const hubs=[];
  for(const r of rows.slice(hi+1)){
    const name=String(r[c.hub]==null?'':r[c.hub]).trim(); const t=nn(r[c.target]); if(!name||!fin(t)) continue;
    const m=nn(r[c.miss]);
    hubs.push({hub:name,region:String(r[c.region]||'Other').trim()||'Other',sup:String(r[c.sup]||'-').trim()||'-',sen:String(r[c.sen]||'-').trim()||'-',target:t,missing:fin(m)?m:0,ofd:nn(r[c.ofd])});
  }
  if(!hubs.length) throw new Error('no hubs');
  let sheetTotal=null; const tr0=rows.slice(0,hi).find(r=>nrm(r[0])==='total');
  if(tr0 && fin(nn(tr0[c.target]))) sheetTotal={target:nn(tr0[c.target]),missing:nn(tr0[c.miss])};
  return {hubs,sheetTotal};
}
function parseUrgent(rows){
  const hi = rows.findIndex(r=>nrm(r[2])==='hubname');
  if(hi<0) throw new Error('header not found');
  const head=rows[hi];
  const nh=head.map(nrm); const ti=nh.indexOf('taregt')>=0?nh.indexOf('taregt'):nh.indexOf('target'); const mi=nh.indexOf('missing');
  const dateIdx=[]; head.forEach((c,i)=>{ if(isDate(c)) dateIdx.push(i); });
  const hubs=[];
  for(const r of rows.slice(hi+1)){ const name=String(r[2]==null?'':r[2]).trim(); if(!name) continue;
    hubs.push({name,sup:String(r[0]||'-'),sen:String(r[1]||'-'),vals:dateIdx.map(i=>nn(r[i])),target:nn(r[ti]),missing:nn(r[mi])}); }
  const keep=[]; dateIdx.forEach((_,k)=>{ if(hubs.some(h=>fin(h.vals[k]))) keep.push(k); });
  const dates=keep.map(k=>head[dateIdx[k]]);
  hubs.forEach(h=>{ h.vals=keep.map(k=>h.vals[k]); });
  if(!hubs.length||!dates.length) throw new Error('no data');
  return {dates,hubs};
}

// ================= Charts (inline SVG, no libraries) =================
const tip=document.getElementById('tip');
function showTip(html,x,y){ tip.innerHTML=html; tip.style.display='block'; const w=tip.offsetWidth,h=tip.offsetHeight; let l=x+14,t=y-h-12; if(l+w>innerWidth-8) l=x-w-14; if(l<8) l=8; if(t<8) t=y+16; tip.style.left=l+'px'; tip.style.top=t+'px'; }
function hideTip(){ tip.style.display='none'; }
document.addEventListener('mouseover',e=>{ const t=e.target.closest&&e.target.closest('[data-tip]'); if(t) showTip(t.getAttribute('data-tip'),e.clientX,e.clientY); });
document.addEventListener('mousemove',e=>{ const t=e.target.closest&&e.target.closest('[data-tip]'); if(t) showTip(t.getAttribute('data-tip'),e.clientX,e.clientY); else if(!e.target.closest('.chart')) hideTip(); });

function niceTicks(min,max,count=4){
  if(min===max){ max=min+1; }
  const step0=(max-min)/count, mag=Math.pow(10,Math.floor(Math.log10(step0))), nm=step0/mag;
  const step=(nm<1.5?1:nm<3?2:nm<7?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];
  for(let v=lo;v<=hi+step*1e-6;v+=step) t.push(+v.toFixed(8));
  return t;
}
const CH=[];
function chart(type,cfg){ CH.push({type,cfg}); return `<div class="chart" data-i="${CH.length-1}"></div>`; }
function mountCharts(){
  document.querySelectorAll('#page .chart').forEach(el=>{
    const c=CH[+el.dataset.i]; if(!c) return;
    if(c.type==='line') drawLine(el,c.cfg); else if(c.type==='lanes') drawLanes(el,c.cfg); else drawBars(el,c.cfg);
  });
}
function labelsEvery(n,iw){ const gap=iw/Math.max(1,n-1); return gap>=34? Array.from({length:n},(_,i)=>i) : xlabelIdx(n,iw,34); }
function xlabelIdx(n,iw,minGap=58){ const k=Math.max(1,Math.ceil(minGap/(iw/Math.max(1,n-1||1)))); const out=[]; for(let i=0;i<n;i+=k) out.push(i); return out; }

function drawLine(el,c){
  const W=Math.max(260,el.clientWidth||600), H=c.height||230, m={l:48,r:c.allLabels?26:18,t:c.allLabels?30:16,b:30};
  const n=c.labels.length;
  const vals=c.series.flatMap(s=>s.values.filter(fin));
  if(!vals.length){ el.innerHTML='<p class="cap">No data</p>'; return; }
  let lo=Math.min(...vals), hi=Math.max(...vals); if(c.zero) lo=Math.min(0,lo);
  let ticks=niceTicks(lo,hi); lo=ticks[0]; hi=ticks[ticks.length-1];
  if(c.multi){ ticks=[0,25,50,75,100]; lo=0; hi=100; }
  const f=c.fmt||fmt;
  m.l=c.multi?14:Math.max(48,14+6.4*Math.max(...ticks.map(t=>f(t).length)));
  if(c.multi){ m.t=34; m.r=14; }
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const X=i=>m.l+(n<2?iw/2:i*iw/(n-1)), Y=v=>m.t+ih-(v-lo)/((hi-lo)||1)*ih;
  let g='';
  ticks.forEach(t=>{ g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)" stroke-width="1"/>${c.multi?'':`<text x="${m.l-8}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--sub)">${esc(f(t))}</text>`}`; });
  (c.allLabels?labelsEvery(n,iw):xlabelIdx(n,iw)).forEach(i=>{ g+=`<text x="${X(i)}" y="${H-9}" text-anchor="middle" font-size="11" fill="var(--sub)">${esc(c.labels[i])}</text>`; });
  c.series.forEach(s=>{
    let d='',open=false;
    s.values.forEach((v,i)=>{ if(fin(v)){ d+=(open?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1); open=true; } else open=false; });
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"${s.dashed?' stroke-dasharray="6 5"':''}/>`;
    if(!s.dashed && n<=24) s.values.forEach((v,i)=>{ if(fin(v)) g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${s.color}" stroke="var(--card)" stroke-width="1.5"/>`; });
  });
  if(c.multi){
    const L=[]; c.series.forEach(s=>{ let l=-1; s.values.forEach((v,i)=>{ if(fin(v)) l=i; }); if(l>=0) L.push({s,l,y:Y(s.values[l])-10}); });
    L.sort((p,q)=>p.y-q.y);
    for(let i=1;i<L.length;i++){ if(L[i].y-L[i-1].y<16) L[i].y=L[i-1].y+16; }   // keep labels from overlapping
    L.forEach(o=>{ const sf=o.s.fmt||fmt; g+=`<text x="${Math.min(X(o.l),W-m.r)-8}" y="${o.y}" text-anchor="end" font-size="12" font-weight="700" fill="${o.s.color}" stroke="var(--card)" stroke-width="3" paint-order="stroke">${esc(sf(o.s.raw[o.l]))}</text>`; });
  }
  const ls=c.series.find(s=>!s.dashed)||c.series[0]; let li=-1; ls.values.forEach((v,i)=>{ if(fin(v)) li=i; });
  if(c.allLabels){
    const sm=iw/Math.max(1,n-1)<46, fs=sm?10:12;
    ls.values.forEach((v,i)=>{ if(!fin(v)) return; const txt=f(v);
      g+=`<text x="${X(i)}" y="${Y(v)-10}" text-anchor="${i===0&&n>1?'start':(i===n-1&&n>1?'end':'middle')}" font-size="${fs}" font-weight="700" fill="var(--ink)" stroke="var(--card)" stroke-width="3" paint-order="stroke">${esc(txt)}</text>`; });
  }
  else if(!c.multi && li>=0 && c.endLabel!==false){ g+=`<text x="${Math.min(X(li),W-m.r)}" y="${Y(ls.values[li])-12}" text-anchor="${li>n-3?'end':'middle'}" font-size="12" font-weight="700" fill="var(--ink)" stroke="var(--card)" stroke-width="3" paint-order="stroke">${esc(f(ls.values[li]))}</text>`; }
  g+=`<line class="cx" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--sub)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||'chart')}">${g}<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  const svg=el.querySelector('svg'), cx=svg.querySelector('.cx');
  const move=ev=>{
    const r=svg.getBoundingClientRect(), p=(ev.touches?ev.touches[0]:ev);
    const i=Math.max(0,Math.min(n-1,Math.round((p.clientX-r.left-m.l)/(iw||1)*(n-1))));
    cx.setAttribute('x1',X(i)); cx.setAttribute('x2',X(i)); cx.setAttribute('visibility','visible');
    let h=`<b>${esc(c.labels[i])}</b>`;
    c.series.forEach(s=>{ if(fin(s.values[i])) h+=`<br><i style="background:${s.color}"></i>${esc(s.name)}: <b>${esc(c.multi?(s.fmt||fmt)(s.raw[i]):f(s.values[i]))}</b>`; });
    showTip(h,p.clientX,p.clientY);
  };
  svg.addEventListener('mousemove',move); svg.addEventListener('touchstart',move,{passive:true}); svg.addEventListener('touchmove',move,{passive:true});
  svg.addEventListener('mouseleave',()=>{ cx.setAttribute('visibility','hidden'); hideTip(); });
}


// One chart, stacked lanes: every series keeps its own scale, so each day's number can be shown without overlapping.
function drawLanes(el,c){
  const W=Math.max(300,el.clientWidth||700), k=c.series.length, n=c.labels.length;
  const m={l:14,r:22,t:6,b:30}, laneH=c.laneHeight||112, H=m.t+m.b+k*laneH;
  const iw=W-m.l-m.r, X=i=>m.l+(n<2?iw/2:i*iw/(n-1));
  const fs=iw/Math.max(1,n-1)<46?10:12;
  let g='';
  c.series.forEach((s,j)=>{
    const top=m.t+j*laneH, padT=34, padB=12, ih=laneH-padT-padB;
    const v=s.values.filter(fin); const lo=Math.min(...v), hi=Math.max(...v);
    const Y=x=>top+padT+ih-(hi>lo?(x-lo)/(hi-lo):0.5)*ih;
    const f=s.fmt||fmt;
    if(j>0) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${top}" y2="${top}" stroke="var(--grid)" stroke-width="1"/>`;
    g+=`<text x="${m.l}" y="${top+17}" font-size="13" font-weight="800" fill="${s.color}">${esc(s.name)}</text>`;
    let d='',open=false;
    s.values.forEach((x,i)=>{ if(fin(x)){ d+=(open?'L':'M')+X(i).toFixed(1)+' '+Y(x).toFixed(1); open=true; } else open=false; });
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((x,i)=>{ if(!fin(x)) return;
      g+=`<circle cx="${X(i)}" cy="${Y(x)}" r="3" fill="${s.color}" stroke="var(--card)" stroke-width="1.5"/>`;
      g+=`<text x="${X(i)}" y="${Y(x)-9}" text-anchor="${i===0&&n>1?'start':(i===n-1&&n>1?'end':'middle')}" font-size="${fs}" font-weight="700" fill="var(--ink)" stroke="var(--card)" stroke-width="3" paint-order="stroke">${esc(f(x))}</text>`; });
  });
  const every=iw/Math.max(1,n-1)>=34?1:Math.ceil(34/(iw/Math.max(1,n-1)));
  for(let i=0;i<n;i+=every) g+=`<text x="${X(i)}" y="${H-9}" text-anchor="${i===0?'start':'middle'}" font-size="11" fill="var(--sub)">${esc(c.labels[i])}</text>`;
  g+=`<line class="cx" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" stroke="var(--sub)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||'chart')}">${g}<rect x="${m.l}" y="${m.t}" width="${iw}" height="${H-m.t-m.b}" fill="transparent"/></svg>`;
  const svg=el.querySelector('svg'), cx=svg.querySelector('.cx');
  const move=ev=>{ const r=svg.getBoundingClientRect(), p=(ev.touches?ev.touches[0]:ev);
    const i=Math.max(0,Math.min(n-1,Math.round((p.clientX-r.left-m.l)/(iw||1)*(n-1))));
    cx.setAttribute('x1',X(i)); cx.setAttribute('x2',X(i)); cx.setAttribute('visibility','visible');
    let h=`<b>${esc(c.labels[i])}</b>`; c.series.forEach(s=>{ if(fin(s.values[i])) h+=`<br><i style="background:${s.color}"></i>${esc(s.name)}: <b>${esc((s.fmt||fmt)(s.values[i]))}</b>`; });
    showTip(h,p.clientX,p.clientY); };
  svg.addEventListener('mousemove',move); svg.addEventListener('touchstart',move,{passive:true}); svg.addEventListener('touchmove',move,{passive:true});
  svg.addEventListener('mouseleave',()=>{ cx.setAttribute('visibility','hidden'); hideTip(); });
}

function drawBars(el,c){
  const W=Math.max(260,el.clientWidth||600), H=c.height||230, m={l:48,r:12,t:20,b:30};
  const n=c.labels.length, f=c.fmt||fmt;
  const vv=c.values.filter(fin); let lo=Math.min(0,...vv), hi=Math.max(0,...vv);
  const ticks=niceTicks(lo,hi); lo=ticks[0]; hi=ticks[ticks.length-1];
  m.l=Math.max(48,14+6.4*Math.max(...ticks.map(t=>f(t).length)));
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const Y=v=>m.t+ih-(v-lo)/((hi-lo)||1)*ih, band=iw/n, bw=Math.min(band*0.64,36);
  let g='';
  ticks.forEach(t=>{ g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t===0?'var(--sub)':'var(--grid)'}" stroke-width="1"/><text x="${m.l-8}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--sub)">${esc(f(t))}</text>`; });
  const labIdx=new Set(xlabelIdx(n,iw,Math.max(40,band)).map(i=>i));
  c.values.forEach((v,i)=>{
    const x=m.l+band*i+(band-bw)/2;
    if(labIdx.has(i)||n<=16) g+=`<text x="${x+bw/2}" y="${H-9}" text-anchor="middle" font-size="11" fill="var(--sub)">${esc(c.labels[i])}</text>`;
    if(!fin(v)) return;
    const col=c.colorFn?c.colorFn(v,i):c.color, y0=Y(0), y1=Y(v), top=Math.min(y0,y1), h=Math.max(2,Math.abs(y0-y1));
    g+=`<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="3" fill="${col}" data-tip="<b>${esc(c.labels[i])}</b><br>${esc(c.name||'Value')}: <b>${esc(f(v))}</b>"/>`;
    if(band>=18) g+=`<text x="${x+bw/2}" y="${(v>=0?top-5:top+h+13)}" text-anchor="middle" font-size="${band>=38?11:(band>=26?10:9)}" font-weight="700" fill="var(--ink)" stroke="var(--card)" stroke-width="3" paint-order="stroke">${esc(f(v))}</text>`;   // value on every bar, above positive and below negative
  });
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||'chart')}">${g}</svg>`;
}

function spark(vals,w=84,h=24,color='var(--blue)'){
  const v=vals.filter(fin); if(v.length<2) return '';
  const lo=Math.min(...v), hi=Math.max(...v), n=vals.length; let d='';
  vals.forEach((x,i)=>{ if(!fin(x)) return; const px=2+i*(w-4)/(n-1), py=h-3-(x-lo)/((hi-lo)||1)*(h-6); d+=(d?'L':'M')+px.toFixed(1)+' '+py.toFixed(1); });
  const lv=last(v), lx=w-2, ly=h-3-(lv-lo)/((hi-lo)||1)*(h-6);
  return `<svg width="${w}" height="${h}" style="vertical-align:middle"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${lx}" cy="${ly}" r="2.4" fill="${color}"/></svg>`;
}
function hbars(items,{fmtv=fmt,color='var(--blue)',max}={}){

}

document.getElementById('side').addEventListener('click',e=>{
  if(e.target.closest('[data-toggle]')){ navOpen=!navOpen; renderNav(); return; }
  const b=e.target.closest('.nav'); if(!b) return; if(b.dataset.p==='hubs') navOpen=true; go(b.dataset.p); });
function go(k){ current=k; try{ history.replaceState(null,'','#'+k); }catch(e){} renderNav(); renderPage(); scrollTo(0,0); }

// ================= Pages =================
function setSubtitle(t){ document.getElementById('subtitle').textContent=t; }
let lastSrc='', lastStatusText='';
function stamp(){ return isLive && lastUpdate ? 'Updated '+(new Date()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})+(lastSrc?' \u00B7 '+lastSrc:'') : (lastStatusText||'connecting\u2026'); }
function renderPage(){
  CH.length=0; hideTip();
  const sub=SUBS.find(x=>x.key===current), mk=sub?'hubs':current;
  const p=PAGES.find(x=>x.key===mk);
  document.getElementById('pageTitle').textContent=sub?'Hubs \u00B7 '+sub.label:p.label;
  document.getElementById('downloadBtn').hidden = current!=='hubs';
  const host=document.getElementById('page');
  const noData=(title,msg)=>{ host.innerHTML=`<div class="panel"><h2>${esc(title)}</h2><p class="cap">${esc(msg)}</p></div>`; setSubtitle(stamp()); };
  if(sub){
    const t=MODEL.hubs&&MODEL.hubs.side&&MODEL.hubs.side[sub.m];
    if(!t){ return noData(isLive?'Table not found':'Loading\u2026', isLive?'Could not find the \u201C'+sub.label+'\u201D table to the right of the hubs table in the first tab.':'Reading the Google Sheet, please wait.'); }
    host.innerHTML={ofd:pgSideOfd,stars:pgSideStars,std:pgSideStd}[sub.m](t,MODEL.hubs.side);
    mountCharts(); mountSide(current); return;
  }
  if(!MODEL[current]){ return noData(isLive?'No data for this tab':'Loading\u2026', isLive?'Could not read the \u201C'+p.sheet+'\u201D tab'+(errs[current]?': '+errs[current]:'')+'.':'Reading the Google Sheet, please wait.'); }
  const fn={hubs:pgHubs,bosta:pgBosta,acq:pgAcq,days:pgDays,target:pgTarget,urgent:pgUrgent,attr:pgAttr}[current];
  host.innerHTML=fn(MODEL[current]);
  mountCharts();
  if(current==='target') mountTarget();
}

// ---- Hubs ----
function ofdColor(val,mn=ofdMin,mx=ofdMax){ const t=(val-mn)/((mx-mn)||1); const hue=(1-t)*120; return {bg:`hsl(${hue},70%,90%)`,fg:`hsl(${hue},65%,28%)`}; }
function ofdSolid(val,mn=ofdMin,mx=ofdMax){ const t=(val-mn)/((mx-mn)||1); return `hsl(${(1-t)*120},62%,52%)`; }
function hcard(d){
  const missing=d.target-d.active, pct=d.target?d.active/d.target*100:0;
  const sc=pct>=80?'#1a9c6b':pct>=50?'#e08a1f':'#d1394a', on=Math.max(0,Math.min(10,Math.round(pct/10)));
  return `<div class="gc" style="--c:${sc}">
    <div class="gn"><svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${esc(d.hub)}</div>
    <div class="gb">${fmt(d.active)}</div><div class="gcap">Active stars</div>
    <div class="gseg">${Array.from({length:10},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('')}</div>
    <div class="gt"><span>Target <b>${fmt(d.target)}</b></span>${missing>0?`<em>-${fmt(missing)} missing</em>`:`<em class="ok">Target exceeded</em>`}</div>
    <div class="gg">
      <div><b>${fmt(d.stars)}</b>Total stars</div>
      <div><b>${fmt(d.ofd)}</b>OFD</div>
      <div><b>${fmt(d.absence)}</b>Absence \u2022 ${esc(d.absencePct)}</div>
      <div class="hi" style="--hc:${ofdSolid(d.ofdPerStar)}"><b>${fmt(d.ofdPerStar)}</b>OFD/Star</div>
    </div></div>`;
}
function setHubs(hubs,totals){
  D=hubs.map(d=>({...d})); TOTALS=totals;
  ofdMin=Math.min(...D.map(d=>d.ofdPerStar)); ofdMax=Math.max(...D.map(d=>d.ofdPerStar));
  kpis=[{label:'Target',val:fmt(TOTALS.target),c:'#2f5ee0'},{label:'Total stars',val:fmt(TOTALS.stars),c:'#8892a3'},{label:'Active Star',val:fmt(TOTALS.active),c:'#2f5ee0'},
    {label:'absence',val:fmt(TOTALS.absence),c:'#e08a1f'},{label:'absence %',val:TOTALS.absencePct,c:'#e08a1f'},{label:'OFD',val:fmt(TOTALS.ofd),c:'#1a9c6b'},
    {label:'OFD/Star',val:fmt(TOTALS.ofdPerStar),c:'#d1394a'},{label:'Standerd OFD',val:fmt(TOTALS.stdOfd),c:'#8892a3'},{label:'Missing of target',val:fmt(TOTALS.missing),c:'#d1394a'}];
  sortHubs();
}
function sortHubs(){ const a=[...D]; if(sortMode==='ofd') a.sort((x,y)=>y.ofdPerStar-x.ofdPerStar); else a.sort((x,y)=>(y.target-y.active)-(x.target-x.active)); currentSorted=a; }
function pgHubs(){
  sortHubs();
  const overall=TOTALS.target?Math.round(TOTALS.stars/TOTALS.target*1000)/10:0;
  setSubtitle(`${D.length} hubs • Overall achievement ${overall}% • ${stamp()}`);
  return `<div class="kpis hubkpis">${kpis.map(k=>`<div class="kpi" style="--c:${k.c}"><div class="label">${esc(k.label)}</div><div class="val">${esc(k.val)}</div></div>`).join('')}</div>
  <div class="sortbar"><span class="sl">Sort hubs by:</span>
    <button class="sortbtn${sortMode==='ofd'?' active':''}" data-sort="ofd">Highest OFD/Star</button>
    <button class="sortbtn${sortMode==='missing'?' active':''}" data-sort="missing">Highest Missing</button></div>
  <div class="cards">${currentSorted.map(hcard).join('')}</div>`;
}
document.getElementById('page').addEventListener('click',e=>{ const b=e.target.closest('.sortbtn'); if(!b) return; sortMode=b.dataset.sort; renderPage(); });

// ---- Hub side tables ----
const ST={}, SIDE_T={};
function sTable(key,cols,rows,defK,defDir){
  if(!ST[key]) ST[key]={k:defK,dir:defDir,q:''};
  SIDE_T[key]={cols,rows};
  return `<div class="panel" style="margin-top:16px"><h2>All hubs</h2><p class="cap">Click a column to sort</p>
    <div class="tools"><input class="search" id="sq" placeholder="Search hub\u2026" value="${esc(ST[key].q)}"></div>
    <div class="tw maxh"><table><thead id="sh"></thead><tbody id="sb"></tbody></table></div></div>`;
}
function mountSide(key){
  const T=SIDE_T[key]; if(!T) return; const st=ST[key];
  const draw=()=>{

function xlsxToWorkbook(data,type){
  if(typeof XLSX==='undefined') throw new Error('spreadsheet reader did not load');
  const book=XLSX.read(data,{type:type||'base64'}); const out={};
  book.SheetNames.forEach(name=>{
    const ws=book.Sheets[name]; if(!ws['!ref']){ out[name]=[]; return; }
    const rg=XLSX.utils.decode_range(ws['!ref']); const rows=[];
    for(let r=rg.s.r;r<=rg.e.r;r++){
      const row=[];
      for(let c=rg.s.c;c<=rg.e.c;c++){
        const cell=ws[XLSX.utils.encode_cell({r,c})]; let v=null;
        if(cell && cell.v!=null){
          if(cell.t==='n' && cell.z && XLSX.SSF.is_date(cell.z)){ const d=XLSX.SSF.parse_date_code(cell.v); v=d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0'); }
          else if(cell.t==='d' && cell.v instanceof Date){ const d=cell.v; v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
          else if(cell.t==='e') v=null; else v=cell.v;
        }
        row.push(v);
      }
      while(row.length && row[row.length-1]==null) row.pop();
      rows.push(row);
    }
    while(rows.length && !rows[rows.length-1].length) rows.pop();
    out[name]=rows;
  });
  return out;
}
function extractB64(p){
  if(p && typeof p==='object'){ if(typeof p.content==='string') return p.content; if(Array.isArray(p.content)){ const t=p.content.find(x=>x&&typeof x.text==='string'); if(t) return extractB64(t.text); } }
  if(typeof p==='string'){ const s=p.trim(); if(s.startsWith('{')){ try{ return extractB64(JSON.parse(s)); }catch(e){} } return s; }
  return '';
}

function gvizDate(v){ const m=/^Date\((\d+),(\d+),(\d+)/.exec(v); return m? m[1]+'-'+String(+m[2]+1).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0') : v; }
function respToRows(resp){
  if(!resp||resp.status!=='ok'||!resp.table){ const er=resp&&resp.errors&&resp.errors[0]; const msg=er?String(er.reason||'')+' '+String(er.message||''):'bad response'; throw new Error(/access|denied|permission|sign/i.test(msg)?'HTTP 403':'bad response: '+msg); }
  const rows=(resp.table.rows||[]).map(r=>{ const row=(r.c||[]).map(cell=>{ if(!cell||cell.v==null) return null; return typeof cell.v==='string'?gvizDate(cell.v):cell.v; }); while(row.length&&row[row.length-1]==null) row.pop(); return row; });
  while(rows.length&&!rows[rows.length-1].length) rows.pop();
  return rows;
}
function gvizUrl(name,extra,range){ return 'https://docs.google.com/spreadsheets/d/'+DRIVE_FILE_ID+'/gviz/tq?sheet='+encodeURIComponent(name)+(range?'&range='+encodeURIComponent(range):'')+'&headers=0&tqx='+extra+'&_='+Date.now()+Math.floor(Math.random()*1e6); }
async function loadTabFetch(name,range){
  const res=await fetch(gvizUrl(name,'out:json',range),{cache:'no-store',credentials:'omit'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const t=await res.text(); const i=t.indexOf('{'), j=t.lastIndexOf('}');
  if(i<0||j<i) throw new Error('bad response');
  return respToRows(JSON.parse(t.slice(i,j+1)));
}
// JSONP first (works from any website); plain fetch as a fallback
async function loadTabJson(name,range){ try{ return await loadTabJsonp(name,range); }catch(e1){ try{ return await loadTabFetch(name,range); }catch(e2){ throw e1; } } }
// Google drops text/date cells that sit in a column of mostly numbers. A single-row request has no such conflict,
// so the top rows (headers, dates, totals) are requested one by one and used to fill the gaps of the full tab.
const TOP_ROWS=6;
async function loadTab(name){
  const full=await loadTabJson(name);
  const tops=await Promise.allSettled(Array.from({length:TOP_ROWS},(_,i)=>loadTabJson(name,'A'+(i+1)+':AZ'+(i+1))));
  const rows=full.map(r=>r.slice());
  tops.forEach((t,i)=>{
    if(t.status!=='fulfilled'||!t.value[0]) return;
    const fix=t.value[0]; const row=rows[i]||(rows[i]=[]);
    for(let j=0;j<fix.length;j++){ if(fix[j]!=null && fix[j]!=='') row[j]=fix[j]; }  // single-row value is always the true one (full-tab value may be null or a date turned into a number)
  });
  return rows.map(r=>{ r=Array.from(r,v=>v===undefined?null:v); while(r.length&&r[r.length-1]==null) r.pop(); return r; });
}
function loadTabJsonp(name,range){
  return new Promise((resolve,reject)=>{
    const cb='__gv'+Date.now()+Math.floor(Math.random()*1e6), s=document.createElement('script'); let done=false,timer=null;
    const cleanup=()=>{ done=true; clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } s.remove(); };
    timer=setTimeout(()=>{ if(!done){ cleanup(); reject(new Error('timeout')); } },10000);
    window[cb]=resp=>{ if(done) return; cleanup(); try{ resolve(respToRows(resp)); }catch(e){ reject(e); } };
    s.onerror=()=>{ if(!done){ cleanup(); reject(new Error('script blocked')); } };
    s.src=gvizUrl(name,'out:json;responseHandler:'+cb,range);
    document.head.appendChild(s);
  });
}
async function fetchText(url){ const res=await fetch(url,{cache:'no-store'}); if(!res.ok) throw new Error('HTTP '+res.status); return res.text(); }
function parseCSV(text){
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true; else if(ch===','){ row.push(cell); cell=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); cell=''; rows.push(row); row=[]; }
    else cell+=ch; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.map(r=>{ r=r.map(c=>c===''?null:c); while(r.length&&r[r.length-1]==null) r.pop(); return r; });
}
function whyFailed(es){
  if(es.some(e=>/^HTTP (401|403|404)/.test(e))) return 'Google refused access \u2013 in the sheet press Share and set \u201CAnyone with the link\u201D to Viewer, and publish the entire document to the web';
  if(es.every(e=>/Failed to fetch|script blocked|timeout|NetworkError|Load failed/i.test(e))) return 'could not reach Google (no internet, or the page is opened inside a network that blocks it)';
  return 'unexpected answer from Google';
}
function csvDates(rows){
  const MI={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  const p2=n=>String(n).padStart(2,'0');
  return rows.map(r=>r.map(c=>{
    if(typeof c!=='string') return c; const s=c.trim(); let m;
    if((m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s))) return m[3]+'-'+p2(m[1])+'-'+p2(m[2]);        // M/D/YYYY
    if((m=/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/.exec(s))) return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);        // YYYY/M/D
    if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s))) return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);          // YYYY-M-D
    if((m=/^(\d{1,2})[ -]([A-Za-z]{3})[a-z]*[ -,]*(\d{4})$/.exec(s)) && MI[m[2].toLowerCase()]) return m[3]+'-'+p2(MI[m[2].toLowerCase()])+'-'+p2(m[1]);  // 1-Oct-2026
    if((m=/^([A-Za-z]{3})[a-z]* (\d{1,2}),? (\d{4})$/.exec(s)) && MI[m[1].toLowerCase()]) return m[3]+'-'+p2(MI[m[1].toLowerCase()])+'-'+p2(m[2]);        // Oct 1, 2026
    const yr=new Date().getFullYear();
    if((m=/^(\d{1,2})[ -]([A-Za-z]{3})[a-z]*$/.exec(s)) && MI[m[2].toLowerCase()]) return yr+'-'+p2(MI[m[2].toLowerCase()])+'-'+p2(m[1]);   // 1-Oct
    if((m=/^([A-Za-z]{3})[a-z]* (\d{1,2})$/.exec(s)) && MI[m[1].toLowerCase()]) return yr+'-'+p2(MI[m[1].toLowerCase()])+'-'+p2(m[2]);         // Oct 1
    return c; })); }
async function loadPubXlsx(){

  if(!res.ok) throw new Error('HTTP '+res.status);

}
async function loadWeb(){

    const wb={}; let ok=0;
    res.forEach((r,i)=>{ if(r.status==='fulfilled'&&r.value.length){ wb[names[i]]=r.value; ok++; } else if(r.status==='rejected') es.push(String(r.reason&&r.reason.message||r.reason)); });
    // use it only if every tab is readable correctly (Google can drop text cells in mixed columns)

    if(ok===names.length) es.push('direct read returned incomplete cells');
    // 2) the published link as xlsx: exact cell values for every tab (Google may delay a few minutes)
    try{ const x=await loadPubXlsx(); if(validWorkbook(x)){ lastSrc='published link'; acceptWorkbook(x,'published link (may lag a few minutes)'); return; } es.push('published xlsx incomplete'); }
    catch(e){ es.push(String(e&&e.message||e)); }
    if(ok){
      // keep only the tabs that are readable; never overwrite good data with a broken tab
      const part={}; let good=0;
      PAGES.forEach((p,i)=>{ const rows=wb[p.sheet]; if(!rows) return; try{ PARSERS[p.key](rows); part[p.sheet]=rows; good++; }catch(e){ es.push('tab "'+p.sheet+'": '+e.message); } });
      if(good){ lastSrc='sheet (partial)'; const bad=es.filter(x=>x.startsWith('tab ')).map(x=>x.slice(0,70)).join(' | '); acceptWorkbook(part,good+' of '+names.length+' tabs'+(bad?' – '+bad:'')); return; }
    }
    // 3) last resort: the CSV link (first tab only)
    try{
      const text=await fetchText(SHEET_URL+'&_='+Date.now());
      lastSrc='published CSV (Hubs only)'; acceptWorkbook({[first]:csvDates(parseCSV(text))},'Hubs tab only (CSV)'); return;
    }catch(e){ es.push(String(e&&e.message||e)); }
    setStatus(isLive?'stale':'offline',whyFailed(es));
  } finally { loading=false; }
}

function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fitText(ctx,text,maxWidth){ if(ctx.measureText(text).width<=maxWidth) return text; let t=text; while(t.length>1&&ctx.measureText(t+'…').width>maxWidth) t=t.slice(0,-1); return t+'…'; }
function drawPinIcon(ctx,cx,cy,r,color){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=Math.max(1.2,r*0.22); ctx.lineJoin='round'; ctx.lineCap='round';
  const gap=44*Math.PI/180, a1=Math.PI/2+gap/2, a2=Math.PI/2-gap/2;
  const p2={x:cx+r*Math.cos(a2),y:cy+r*Math.sin(a2)}, tip={x:cx,y:cy+r*2.15};
  ctx.beginPath(); ctx.arc(cx,cy,r,a1,a2,false); ctx.lineTo(tip.x,tip.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,r*0.36,0,Math.PI*2); ctx.stroke(); ctx.restore();
}
function drawCard(ctx,d,x,y,w,h){
  const missing=d.target-d.active, pct=d.target?d.active/d.target*100:0;
  const sc=pct>=80?'#1a9c6b':pct>=50?'#e08a1f':'#d1394a', on=Math.max(0,Math.min(10,Math.round(pct/10)));
  ctx.save(); ctx.shadowColor='rgba(20,25,35,.28)'; ctx.shadowBlur=18; ctx.shadowOffsetY=6;
  const gr=ctx.createLinearGradient(x,y,x+w*0.6,y+h); gr.addColorStop(0,'#1f2530'); gr.addColorStop(1,'#151a22');
  ctx.fillStyle=gr; roundRect(ctx,x,y,w,h,18); ctx.fill(); ctx.restore();
  ctx.save(); roundRect(ctx,x,y,w,h,18); ctx.clip();
  const rg=ctx.createRadialGradient(x+w-6,y+4,0,x+w-6,y+4,92); rg.addColorStop(0,sc+'55'); rg.addColorStop(1,sc+'00'); ctx.fillStyle=rg; ctx.fillRect(x,y,w,h); ctx.restore();
  ctx.strokeStyle='#2c3442'; ctx.lineWidth=1; roundRect(ctx,x+0.5,y+0.5,w-1,h-1,18); ctx.stroke();
  const px=x+18, iw=w-36; let py=y+32; ctx.textAlign='left';
  ctx.fillStyle='#9aa6b8'; ctx.font='700 14px Segoe UI, Arial'; drawPinIcon(ctx,px+6,py-9,6,'#9aa6b8'); ctx.fillText(fitText(ctx,d.hub,w-58),px+18,py);
  py+=46; ctx.fillStyle='#ffffff'; ctx.font='800 44px Segoe UI, Arial'; ctx.fillText(fmt(d.active),px,py);
  py+=24; ctx.fillStyle='#5fd6a6'; ctx.font='700 14px Segoe UI, Arial'; ctx.fillText('Active stars',px,py);
  py+=18; const gap=4, sw=(iw-gap*9)/10;
  for(let i=0;i<10;i++){ ctx.fillStyle=i<on?sc:'#2d3544'; roundRect(ctx,px+i*(sw+gap),py,sw,7,3.5); ctx.fill(); }
  py+=30; ctx.font='400 14px Segoe UI, Arial'; ctx.fillStyle='#9aa6b8'; ctx.fillText('Target ',px,py);
  const tw=ctx.measureText('Target ').width; ctx.fillStyle='#ffffff'; ctx.font='700 16px Segoe UI, Arial'; ctx.fillText(fmt(d.target),px+tw,py);
  ctx.textAlign='right'; ctx.font='700 14px Segoe UI, Arial'; ctx.fillStyle=missing>0?'#ff7a8a':'#5fd6a6';
  ctx.fillText(missing>0?'-'+fmt(missing)+' missing':'Target exceeded',x+w-18,py); ctx.textAlign='left';
  py+=18; const mw=(iw-10)/2, mh=54;
  const mn=ofdMin, mx=ofdMax, t=(d.ofdPerStar-mn)/((mx-mn)||1), solid=`hsl(${(1-t)*120},62%,52%)`;
  [{v:fmt(d.stars),l:'Total stars'},{v:fmt(d.ofd),l:'OFD'},{v:fmt(d.absence),l:'Absence \u2022 '+d.absencePct},{v:fmt(d.ofdPerStar),l:'OFD/Star',hi:1}].forEach((m,i)=>{
    const mx0=px+(i%2)*(mw+10), my=py+Math.floor(i/2)*(mh+10);
    ctx.fillStyle=m.hi?solid:'#262d3a'; roundRect(ctx,mx0,my,mw,mh,11); ctx.fill();
    ctx.fillStyle=m.hi?'#12161d':'#ffffff'; ctx.font='700 19px Segoe UI, Arial'; ctx.fillText(fitText(ctx,m.v,mw-22),mx0+12,my+25);
    ctx.fillStyle=m.hi?'#12161d':'#9aa6b8'; ctx.font=(m.hi?'600':'400')+' 12px Segoe UI, Arial'; ctx.fillText(fitText(ctx,m.l,mw-22),mx0+12,my+43); });
}
const PER_IMAGE=28;   // cards per downloaded image (4 rows x 7)
async function buildImageBlob(part,parts){
  part=part||0; parts=parts||1;
  const cols=7, cardW=280, cardH=304, gap=18, pad=32;
  const all=currentSorted.length?currentSorted:D;
  const list=parts>1 ? (part===0 ? all.slice(0,PER_IMAGE) : all.slice(PER_IMAGE)) : all;   // image 1 = first 28 cards, image 2 = all the rest
  const first=part===0, headerH=first?206:84, rows=Math.ceil(list.length/cols);
  const width=pad*2+cols*cardW+(cols-1)*gap, height=headerH+pad+rows*(cardH+gap);
  // as sharp as the browser allows: up to 4x, but never past the canvas limits (16k px per side, ~200M pixels)
  let scale=4; while(scale>1 && (width*scale>15000 || height*scale>15000 || width*scale*height*scale>2e8)) scale-=0.25;
  const canvas=document.createElement('canvas'); canvas.width=Math.round(width*scale); canvas.height=Math.round(height*scale);
  const ctx=canvas.getContext('2d'); ctx.scale(scale,scale);
  ctx.fillStyle='#dcdfe4'; ctx.fillRect(0,0,width,height);
  ctx.fillStyle='#1c1f26'; ctx.font='700 23px Segoe UI, Arial'; ctx.textAlign='left';
  ctx.fillText('Fleet (ACQ)-LM'+(parts>1?'  \u2022  Part '+(part+1)+' of '+parts:''),pad,38);
  ctx.fillStyle='#68707d'; ctx.font='400 13px Segoe UI, Arial';
  const from=part===0?1:PER_IMAGE+1; ctx.fillText(parts>1 ? 'Hubs '+from+'\u2013'+(from+list.length-1)+' of '+all.length+'  \u2022  '+document.getElementById('subtitle').textContent : document.getElementById('subtitle').textContent,pad,58);
  if(first){
    const kW=(width-pad*2-(kpis.length-1)*10)/kpis.length, kpiH=100;
    kpis.forEach((k,i)=>{ const x=pad+i*(kW+10), y=74;
      ctx.fillStyle='#eceef1'; roundRect(ctx,x,y,kW,kpiH,10); ctx.fill(); ctx.strokeStyle='#cdd1d8'; roundRect(ctx,x,y,kW,kpiH,10); ctx.stroke();
      ctx.fillStyle=k.c; ctx.fillRect(x,y,5,kpiH); ctx.textAlign='left';
      ctx.fillStyle='#1a9c6b'; ctx.font='800 20px Segoe UI, Arial'; ctx.fillText(fitText(ctx,k.label,kW-24),x+16,y+36);
      ctx.fillStyle='#1c1f26'; ctx.font='700 30px Segoe UI, Arial'; ctx.fillText(k.val,x+16,y+78); });
  }
  list.forEach((d,i)=>{ drawCard(ctx,d,pad+(i%cols)*(cardW+gap),headerH+Math.floor(i/cols)*(cardH+gap),cardW,cardH); });
  return await new Promise(res=>canvas.toBlob(res,'image/png'));
}
async function saveBlob(blob,filename){
  try{ if(typeof claude!=='undefined'&&claude.use){ const downloads=await claude.use('downloads'); if(downloads){ await downloads.save({filename,data:blob}); return; } } }catch(e){}
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),8000);
}
document.getElementById('downloadBtn').addEventListener('click',async()=>{
  const btn=document.getElementById('downloadBtn'), original=btn.textContent;
  if(!D.length){ alert('Data is not loaded yet.'); return; }
  btn.disabled=true;
  try{
    const total=(currentSorted.length?currentSorted:D).length, parts=total>PER_IMAGE?2:1;   // two images: first 28 cards, then the rest
    for(let i=0;i<parts;i++){
      btn.textContent=parts>1?'Preparing '+(i+1)+'/'+parts+'...':'Preparing...';
      const blob=await buildImageBlob(i,parts);
      if(!blob) throw new Error('image too large');
      await saveBlob(blob, parts>1?'hubs-dashboard-part'+(i+1)+'.png':'hubs-dashboard.png');
      if(i<parts-1) await new Promise(r=>setTimeout(r,700));   // let the browser accept the next download
    }
  }catch(e){ console.error(e); alert('Could not generate the image. Please try again.'); }
  finally{ btn.disabled=false; btn.textContent=original; }
});
