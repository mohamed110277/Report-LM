<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hubs Performance</title>
<style>
:root{
  --ink:#1c1f26; --sub:#68707d; --line:#e7e9ee; --bg:#f4f5f8; --card:#ffffff;
  --blue:#2f5ee0; --green:#1a9c6b; --red:#d1394a; --orange:#e08a1f;
  --track:#eef0f4;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;}
.wrap{max-width:1320px;margin:0 auto;padding:28px 20px 60px;}
h1{font-size:22px;margin:0 0 4px;}
.sub{color:var(--sub);font-size:13.5px;margin:0 0 22px;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:28px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;border-inline-start:4px solid var(--c,#333);}
.kpi .label{font-size:14px;color:var(--green);font-weight:700;}
.kpi .val{font-size:24px;font-weight:700;margin-top:6px;}

.sortbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 16px;}
.sortbar .sl{font-size:13px;color:var(--sub);font-weight:600;}
.sortbtn{border:1px solid var(--line);background:#fff;color:var(--sub);padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;}
.sortbtn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.dlbtn{border:none;background:var(--green);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;}
.dlbtn:disabled{opacity:.5;cursor:not-allowed;}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
.hcard .name{display:flex;align-items:center;gap:5px;font-weight:700;font-size:12px;color:var(--sub);}
.hcard .name .pin{width:12px;height:12px;flex:none;}
.hcard .big{font-size:28px;font-weight:800;margin:8px 0 0;}
.hcard .capt{font-size:12.5px;color:var(--green);font-weight:700;}
.bar{height:7px;background:var(--track);border-radius:6px;margin:10px 0 8px;overflow:hidden;}
.bar > i{display:block;height:100%;border-radius:6px;}
.pct-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:2px;}
.pct-row b{font-size:15px;}
.miss{color:var(--red);font-weight:700;}
.miss.good{color:var(--green);}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.mini div{background:var(--track);border-radius:8px;padding:8px 10px;}
.mini b{display:block;font-size:15px;}
.mini span{font-size:11px;color:var(--sub);}

.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--sub);background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:20px;}
.status .dot{width:9px;height:9px;border-radius:50%;background:#9aa1ad;}
.status.live{color:var(--green);} .status.live .dot{background:var(--green);box-shadow:0 0 0 0 rgba(26,156,107,.5);animation:pulse 2s infinite;}
.status.stale,.status.offline{color:var(--orange);} .status.stale .dot,.status.offline .dot{background:var(--orange);}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(26,156,107,.5);}70%{box-shadow:0 0 0 7px rgba(26,156,107,0);}100%{box-shadow:0 0 0 0 rgba(26,156,107,0);}}
.refbtn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.refbtn:hover{background:var(--track);}
</style>
</head>

// ---- CSV parsing (handles quotes, commas inside quotes, CRLF) ----
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"'; i++;} else q=false; }
      else cell+=ch;
    } else if(ch==='"'){ q=true; }
    else if(ch===','){ row.push(cell); cell=''; }
    else if(ch==='\n'||ch==='\r'){
      if(ch==='\r' && text[i+1]==='\n') i++;
      row.push(cell); cell=''; rows.push(row); row=[];
    } else cell+=ch;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function num(v){ const n=Number(String(v==null?'':v).replace(/[,\s%]/g,'')); return n; }

function parseMarkdownTable(md){
  const rows=[];
  for(const raw of String(md).split('\n')){
    const l=raw.trim();
    if(!l.startsWith('|')) continue;
    if(/^\|\s*:?-{2,}/.test(l)) continue; // separator row
    const cells=l.replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim().replace(/\\(.)/g,'$1'));
    rows.push(cells);
  }
  return rows;
}
function parseSheet(text){ return rowsToSheet(parseCSV(text)); }
function rowsToSheet(allRows){
  const rows = allRows.filter(r=>r.some(c=>String(c).trim()!==''));
  const hi = rows.findIndex(r=>String(r[0]).trim().toLowerCase()==='hub name');
  if(hi<0) throw new Error('header row not found');
  const head = rows[hi].map(h=>String(h).trim().toLowerCase());
  const col = (...names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const ix = {
    target:col('target'), stars:col('total stars'), active:col('active star','active stars'),
    absence:col('absence'), absencePct:col('absence %'), ofd:col('ofd'),
    ofdPerStar:col('ofd/star'), stdOfd:col('standerd ofd','standard ofd'), missing:col('missing of target')
  };
  for(const k in ix){ if(ix[k]<0) throw new Error('missing column: '+k); }

  const hubs = [];
  for(const r of rows.slice(hi+1)){
    const name = String(r[0]||'').trim();
    const target = num(r[ix.target]);
    if(!name || !isFinite(target) || String(r[ix.target]).trim()==='') continue;
    const active = num(r[ix.active]);
    const stars = num(r[ix.stars]);
    const absence = num(r[ix.absence]);
    hubs.push({
      hub:name, target, stars, active, absence,
      absencePct: String(r[ix.absencePct]||'').trim() || (active? Math.round(absence/active*100)+'%' : '0%'),
      ofd:num(r[ix.ofd]), ofdPerStar:num(r[ix.ofdPerStar]),
      stdOfd:num(r[ix.stdOfd]), missing:num(r[ix.missing])
    });
  }
  let totals;
  const tr = hi>0 ? rows[hi-1] : null;
  if(tr && isFinite(num(tr[ix.target])) && String(tr[ix.target]).trim()!==''){
    totals = {
      target:num(tr[ix.target]), stars:num(tr[ix.stars]), active:num(tr[ix.active]),
      absence:num(tr[ix.absence]), absencePct:String(tr[ix.absencePct]||'').trim(),
      ofd:num(tr[ix.ofd]), ofdPerStar:num(tr[ix.ofdPerStar]),
      stdOfd:num(tr[ix.stdOfd]), missing:num(tr[ix.missing])
    };
  } else {
    const sum = k=>hubs.reduce((a,h)=>a+h[k],0);
    totals = {target:sum('target'), stars:sum('stars'), active:sum('active'), absence:sum('absence'),
      absencePct:(sum('active')? Math.round(sum('absence')/sum('active')*100):0)+'%',
      ofd:sum('ofd'), ofdPerStar:sum('stars')? Math.round(sum('ofd')/sum('stars')):0,
      stdOfd:hubs.length? Math.round(sum('stdOfd')/hubs.length):0, missing:sum('missing')};
  }
  return {hubs, totals};
}

// ---- Render ----
function ofdColor(val){
  const t = (val-ofdMin)/((ofdMax-ofdMin)||1);
  const hue = (1-t)*120; // highest value -> red (0), lowest value -> green (120)
  return {bg:`hsl(${hue},70%,90%)`, fg:`hsl(${hue},65%,28%)`};
}

function hcard(d){
  const missing = d.target - d.active;

  const barWidth = Math.min(Math.max(activePct,0),100);

  const c = ofdColor(d.ofdPerStar);
  return `<div class="hcard">
    <div class="name"><svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${esc(d.hub)}</div>
    <div class="big">${fmt(d.active)}</div>
    <div class="capt">Active stars</div>
    <div class="pct-row"><b>Target ${fmt(d.target)}</b><span class="miss ${missClass}">${missing>0? '-'+fmt(missing)+' missing':'Target exceeded'}</span></div>
    <div class="bar"><i style="width:${barWidth}%;background:${barColor}"></i></div>
    <div class="mini">
      <div><b>${fmt(d.stars)}</b><span>Total stars</span></div>

    </div>
  </div>`;
}

// ---- Live link to the Google Sheet ----
// Inside claude.ai (network blocked) the page reads the sheet through the viewer's Google Drive connector.
// Opened as a plain .html file, it reads the published CSV directly instead.
const DRIVE_SERVER = 'Google Drive';
const DRIVE_TOOL = 'read_file_content';
const DRIVE_FILE_ID = '1U43Cqa-S362A0QTHigdliVJixmmBICX6zOFM3Z4u_aM';
let driveMcp = null;

function setStatus(state, detail){
  const el = document.getElementById('status');
  const txt = document.getElementById('statusText');
  el.className = 'status ' + state;
  const base = state==='live' ? 'Live' : state==='loading' ? 'Updating\u2026' : state==='stale' ? 'Connection lost \u2013 showing last data' : 'Saved data';
  txt.textContent = detail ? base + ' \u2013 ' + detail : base;
}
function extractText(p){
  if(p && typeof p==='object'){ return typeof p.fileContent==='string' ? p.fileContent : JSON.stringify(p); }
  if(typeof p==='string'){
    try{ const j=JSON.parse(p); if(j && typeof j.fileContent==='string') return j.fileContent; }catch(e){}
    return p;
  }
  return '';
}
function acceptSheet(parsed, raw, when){
  if(!parsed.hubs.length) throw new Error('no hub rows');
  if(raw !== lastRaw){ applyData(parsed.hubs, parsed.totals); lastRaw = raw; }
  isLive = true; lastUpdate = when || new Date();
  renderSubtitle();
  setStatus('live');
}

// Path A: Google Drive connector (works inside claude.ai)
function startDrive(mcp){
  driveMcp = mcp;
  setStatus('loading');
  mcp.watchTool(DRIVE_SERVER, DRIVE_TOOL, {fileId: DRIVE_FILE_ID}, ev=>{
    if(ev.type === 'data'){
      try{
        const text = extractText(ev.result.payload);
        const parsed = rowsToSheet(parseMarkdownTable(text));
        acceptSheet(parsed, text, ev.result.cache ? new Date(ev.result.cache.storedAt) : new Date());
      }catch(e){
        console.warn('Could not read the sheet:', e);
        setStatus(isLive ? 'stale' : 'offline', 'could not read the sheet');
      }
    } else {
      const code = ev.error && ev.error.code;
      console.warn('Google Drive read failed:', ev.error);
      if(['not_granted','server_not_connected','needs_reauth','approval_required','blocked_by_policy'].includes(code)){
        setStatus('offline', 'allow Google Drive access to see live data');
      } else {
        setStatus(isLive ? 'stale' : 'offline');
      }
    }
  }, {refetchInterval: REFRESH_MS});
}

// Path B: read the sheet over the web (works when this file is hosted on a website or opened from disk).
// Sources, in order: 1) script-tag load from the sheet (no CORS involved)  2) sheet CSV via fetch  3) published-to-web CSV (Google refreshes it with a delay)
function parseGvizRows(allRows){
  // Columns are read by position: name, target, total stars, active, absence, absence %, OFD, OFD/Star, standard OFD, missing
  const rows = allRows.filter(r=>r.some(c=>String(c).trim()!==''));
  const hubs = []; let totals = null;
  for(const r of rows){
    const name = String(r[0]||'').trim();
    if(!name || name.toLowerCase()==='hub name' || r.length<10) continue;
    if(String(r[1]).trim()==='' || !isFinite(num(r[1]))) continue;
    const active = num(r[3]), absence = num(r[4]);
    const rec = {
      hub:name, target:num(r[1]), stars:num(r[2]), active, absence,
      absencePct: String(r[5]||'').trim() || (active? Math.round(absence/active*100)+'%' : '0%'),
      ofd:num(r[6]), ofdPerStar:num(r[7]), stdOfd:num(r[8]), missing:num(r[9])
    };
    if(!totals && /^total/i.test(name)){ totals = {target:rec.target, stars:rec.stars, active:rec.active, absence:rec.absence, absencePct:rec.absencePct, ofd:rec.ofd, ofdPerStar:rec.ofdPerStar, stdOfd:rec.stdOfd, missing:rec.missing}; continue; }
    hubs.push(rec);
  }
  if(!totals){
    const sum = k=>hubs.reduce((a,h)=>a+h[k],0);
    totals = {target:sum('target'), stars:sum('stars'), active:sum('active'), absence:sum('absence'),
      absencePct:(sum('active')? Math.round(sum('absence')/sum('active')*100):0)+'%',
      ofd:sum('ofd'), ofdPerStar:sum('stars')? Math.round(sum('ofd')/sum('stars')):0,
      stdOfd:hubs.length? Math.round(sum('stdOfd')/hubs.length):0, missing:sum('missing')};
  }
  return {hubs, totals};
}
function parseGviz(text){ return parseGvizRows(parseCSV(text)); }

const GVIZ_BASE = 'https://docs.google.com/spreadsheets/d/' + DRIVE_FILE_ID + '/gviz/tq?sheet=Sheet1';

function loadJsonp(){
  return new Promise((resolve, reject)=>{
    const cb = '__gv' + Date.now() + Math.floor(Math.random()*1e6);
    const s = document.createElement('script');
    let done = false, timer = null;
    const cleanup = ()=>{ done = true; clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } s.remove(); };
    timer = setTimeout(()=>{ if(!done){ cleanup(); reject(new Error('timeout')); } }, 15000);
    window[cb] = (resp)=>{
      if(done) return;
      cleanup();
      if(!resp || resp.status !== 'ok' || !resp.table){
        const err = resp && resp.errors && resp.errors[0];
        const msg = err ? String(err.reason||'') + ' ' + String(err.message||'') : 'bad response';
        reject(new Error(/access|denied|permission|sign/i.test(msg) ? 'HTTP 403' : 'bad response: '+msg));
        return;
      }
      const t = resp.table;
      const rows = [ t.cols.map(c=>String(c.label||'')) ];
      for(const r of (t.rows||[])){
        rows.push((r.c||[]).map(cell=> cell ? (cell.f!=null ? String(cell.f) : (cell.v==null ? '' : String(cell.v))) : ''));
      }
      resolve({parsed: parseGvizRows(rows), raw: JSON.stringify(rows)});
    };
    s.onerror = ()=>{ if(!done){ cleanup(); reject(new Error('script blocked')); } };
    s.src = GVIZ_BASE + '&tqx=out:json;responseHandler:' + cb + '&_=' + Date.now();
    document.head.appendChild(s);
  });
}
async function fetchText(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.text();
}
const WEB_SOURCES = [
  {load: loadJsonp},
  {load: async()=>{ const text = await fetchText(GVIZ_BASE + '&tqx=out:csv&_=' + Date.now()); return {parsed: parseGviz(text), raw: text}; }},
  {load: async()=>{ const text = await fetchText(SHEET_URL + '&_=' + Date.now()); return {parsed: parseSheet(text), raw: text}; }},
  {load: async()=>{ const text = await fetchText(SHEET_URL); return {parsed: parseSheet(text), raw: text}; }},
];
let webSource = 0; // index of the source that worked last time
function whyFailed(errs){
  if(errs.some(e=>/^HTTP (401|403)/.test(e))) return 'sheet is not shared (set it to anyone with the link can view)';
  if(errs.every(e=>/Failed to fetch|script blocked|timeout|NetworkError|Load failed/i.test(e))) return 'cannot reach docs.google.com from this page (network, firewall or site policy)';
  return 'unexpected answer from Google';
}
async function loadWeb(){
  if(loading) return;
  loading = true;
  if(!isLive) setStatus('loading');
  const errs = [];
  try{
    const order = WEB_SOURCES.map((_,i)=>i).sort((a,b)=>(a===webSource?-1:b===webSource?1:a-b));
    for(const i of order){
      try{
        const {parsed, raw} = await WEB_SOURCES[i].load();
        acceptSheet(parsed, raw);
        webSource = i;
        return;
      }catch(e){ errs.push(String(e && e.message || e)); console.warn('Source '+i+' failed:', e); }
    }
    setStatus(isLive ? 'stale' : 'offline', whyFailed(errs));
  }finally{
    loading = false;
  }
}

document.getElementById('refreshBtn').addEventListener('click', ()=>{
  if(driveMcp){ setStatus('loading'); driveMcp.invalidate(DRIVE_SERVER, DRIVE_TOOL).catch(()=>{}); }
  else if(!IN_CLAUDE){ loadWeb(); }
});

// ---- Build a PNG snapshot of the dashboard entirely with Canvas (no external libs) ----
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function fitText(ctx,text,maxWidth){
  if(ctx.measureText(text).width<=maxWidth) return text;
  let t=text;
  while(t.length>1 && ctx.measureText(t+'\u2026').width>maxWidth){ t=t.slice(0,-1); }
  return t+'\u2026';
}
function drawPinIcon(ctx,cx,cy,r,color){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=Math.max(1.2,r*0.22); ctx.lineJoin='round'; ctx.lineCap='round';
  const gap=44*Math.PI/180;
  const a1=Math.PI/2+gap/2, a2=Math.PI/2-gap/2;
  const p1={x:cx+r*Math.cos(a1),y:cy+r*Math.sin(a1)};
  const p2={x:cx+r*Math.cos(a2),y:cy+r*Math.sin(a2)};
  const tip={x:cx,y:cy+r*2.15};
  ctx.beginPath();
  ctx.arc(cx,cy,r,a1,a2,false);
  ctx.lineTo(tip.x,tip.y);
  ctx.lineTo(p2.x,p2.y);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,r*0.36,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}
function drawCard(ctx,d,x,y,w,h){
  ctx.fillStyle='#ffffff'; roundRect(ctx,x,y,w,h,10); ctx.fill();
  ctx.strokeStyle='#e7e9ee'; ctx.lineWidth=1; roundRect(ctx,x,y,w,h,10); ctx.stroke();
  let px=x+18, py=y+30;
  ctx.textAlign='left'; ctx.fillStyle='#68707d'; ctx.font='700 14px Segoe UI, Arial';
  drawPinIcon(ctx, px+6, py-9, 6, '#68707d');
  ctx.fillText(fitText(ctx,d.hub, w-58), px+18, py);
  py+=40; ctx.fillStyle='#1c1f26'; ctx.font='800 32px Segoe UI, Arial';
  ctx.fillText(fmt(d.active), px, py);
  py+=22; ctx.fillStyle='#1a9c6b'; ctx.font='700 15px Segoe UI, Arial';
  ctx.fillText('Active stars', px, py);
  py+=26;
  const missing = d.target-d.active;
  ctx.fillStyle='#1c1f26'; ctx.font='700 15px Segoe UI, Arial';
  ctx.fillText('Target '+fmt(d.target), px, py);
  ctx.textAlign='right'; ctx.fillStyle = missing>0? '#d1394a':'#1a9c6b';
  ctx.font='700 14px Segoe UI, Arial';
  ctx.fillText(missing>0? '-'+fmt(missing)+' missing':'Target exceeded', x+w-18, py);
  ctx.textAlign='left';
  const barY=py+12, barW=w-36;
  ctx.fillStyle='#eef0f4'; roundRect(ctx,px,barY,barW,8,4); ctx.fill();
  const pct=Math.max(0,Math.min(1,d.active/d.target));
  ctx.fillStyle = pct>=0.8?'#1a9c6b':pct>=0.5?'#e08a1f':'#d1394a';
  if(pct>0){ roundRect(ctx,px,barY,Math.max(barW*pct,8),8,4); ctx.fill(); }
  py=barY+34;
  const miniW=(w-36-10)/2, miniH=52;
  const oc = ofdColor(d.ofdPerStar);
  const mini=[
    {v:fmt(d.stars), l:'Total stars', bg:'#eef0f4', fg:'#1c1f26'},
    {v:fmt(d.ofd), l:'OFD', bg:'#eef0f4', fg:'#1c1f26'},
    {v:fmt(d.absence), l:'Absence \u2022 '+d.absencePct, bg:'#eef0f4', fg:'#1c1f26'},
    {v:fmt(d.ofdPerStar), l:'OFD/Star', bg:oc.bg, fg:oc.fg},
  ];
  mini.forEach((m,i)=>{
    const mx=px+(i%2)*(miniW+10), my=py+Math.floor(i/2)*(miniH+10);
    ctx.fillStyle=m.bg; roundRect(ctx,mx,my,miniW,miniH,8); ctx.fill();
    ctx.fillStyle=m.fg; ctx.font='700 16px Segoe UI, Arial';
    ctx.fillText(fitText(ctx,m.v,miniW-20), mx+11, my+23);
    ctx.font='400 12px Segoe UI, Arial'; ctx.fillText(fitText(ctx,m.l,miniW-20), mx+11, my+40);
  });
}
async function buildImageBlob(){
  const scale=4, cols=8, cardW=280, cardH=304, gap=18, pad=32, headerH=250;
  const list = currentSorted.length ? currentSorted : D;
  const rows = Math.ceil(list.length/cols);
  const width = pad*2 + cols*cardW + (cols-1)*gap;
  const height = headerH + pad + rows*(cardH+gap);
  const canvas = document.createElement('canvas');
  canvas.width = width*scale; canvas.height = height*scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle='#f4f5f8'; ctx.fillRect(0,0,width,height);
  ctx.fillStyle='#1c1f26'; ctx.font='700 23px Segoe UI, Arial';
  ctx.fillText('Hubs Performance', pad, 38);
  ctx.fillStyle='#68707d'; ctx.font='400 13px Segoe UI, Arial';
  ctx.fillText(document.getElementById('subtitle').textContent, pad, 58);
  const kW=(width-pad*2-(kpis.length-1)*10)/kpis.length;
  const kpiH=100;
  kpis.forEach((k,i)=>{
    const x=pad+i*(kW+10), y=74;
    ctx.fillStyle='#ffffff'; roundRect(ctx,x,y,kW,kpiH,10); ctx.fill();
    ctx.strokeStyle='#e7e9ee'; roundRect(ctx,x,y,kW,kpiH,10); ctx.stroke();
    ctx.fillStyle=k.c; ctx.fillRect(x,y,5,kpiH);
    ctx.textAlign='left';
    ctx.fillStyle='#1a9c6b'; ctx.font='800 20px Segoe UI, Arial';
    ctx.fillText(fitText(ctx,k.label,kW-24), x+16, y+36);
    ctx.fillStyle='#1c1f26'; ctx.font='700 30px Segoe UI, Arial';
    ctx.fillText(k.val, x+16, y+78);
  });
  list.forEach((d,i)=>{
    const col=i%cols, row=Math.floor(i/cols);
    drawCard(ctx, d, pad+col*(cardW+gap), headerH+row*(cardH+gap), cardW, cardH);
  });
  return await new Promise(res=>canvas.toBlob(res,'image/png'));
}

document.getElementById('downloadBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('downloadBtn');
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = 'Preparing...';
  try{
    const blob = await buildImageBlob();
    let saved = false;
    // Try the claude.ai artifact download capability first (works on the published claude.ai link)
    try{
      if(typeof claude !== 'undefined' && claude.use){
        const downloads = await claude.use('downloads');
        if(downloads){
          btn.textContent = 'Saving...';
          await downloads.save({filename:'hubs-dashboard.png', data: blob});
          saved = true;
        }
      }
    }catch(e){ /* fall through to plain browser download below */ }
    // Fallback: plain browser download (works when this file is opened directly, no claude runtime)
    if(!saved){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'hubs-dashboard.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
    }
  }catch(e){
    console.error(e);
    alert('Could not generate the image. Please try again.');
  }finally{
    btn.disabled = false;
    btn.textContent = original;
  }
});
