<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hubs Performance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#1c1f26; --sub:#5b6371; --line:#cdd1d8; --bg:#dcdfe4; --card:#eceef1;
  --blue:#2f5ee0; --green:#1a9c6b; --red:#d1394a; --orange:#e08a1f;
  --track:#dde0e6; --grid:#d2d6dc; --hover:#e1e4ea; color-scheme:light; --heat:47,94,224;
  box-sizing:border-box;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;}
button{font-family:inherit;}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--card);border-inline-end:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.brand{font-size:17px;font-weight:800;padding:2px 10px 18px;display:flex;align-items:center;gap:10px;}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--blue);display:grid;place-items:center;flex:none;}
.brand i svg{width:17px;height:17px;stroke:#fff;}
.navl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:700;padding:6px 10px;}
.nav{border:0;background:transparent;color:var(--sub);display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:start;width:100%;}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.nav:hover{background:var(--hover);color:var(--ink);}
.nav.active{background:var(--blue);color:#fff;}
.nav .chev{margin-inline-start:auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;}
.nav .chev:hover{background:rgba(127,127,127,.2);}
.nav .chev svg{width:14px;height:14px;transition:transform .15s;}
.nav .chev.open svg{transform:rotate(180deg);}
.nav.subnav{padding:8px 12px 8px 40px;font-size:13px;}
.nav.subnav::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;margin-inline-start:-14px;flex:none;}
.nav .cnt{margin-inline-start:auto;font-size:11px;font-weight:700;background:var(--track);color:var(--sub);border-radius:10px;padding:2px 7px;}
.nav.active .cnt{background:rgba(255,255,255,.22);color:#fff;}
.main{padding:26px 24px 60px;min-width:0;max-width:1400px;width:100%;margin:0 auto;}
h1{font-size:23px;margin:0 0 4px;}
.sub{color:var(--sub);font-size:13.5px;margin:0 0 22px;}
.topbar{margin-bottom:6px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;}
.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--sub);background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:20px;max-width:100%;}
.status .dot{width:9px;height:9px;border-radius:50%;background:#9aa1ad;flex:none;}
.status.live{color:var(--green);} .status.live .dot{background:var(--green);animation:pulse 2s infinite;}
.status.stale,.status.offline{color:var(--orange);} .status.stale .dot,.status.offline .dot{background:var(--orange);}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(26,156,107,.5);}70%{box-shadow:0 0 0 7px rgba(26,156,107,0);}100%{box-shadow:0 0 0 0 rgba(26,156,107,0);}}
.refbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.refbtn:hover{background:var(--track);}
.dlbtn{border:none;background:var(--green);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.dlbtn:disabled{opacity:.5;cursor:not-allowed;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
.hubkpis{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:28px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-inline-start:4px solid var(--c,#333);min-width:0;}
.kpi .label{font-size:13px;color:var(--sub);font-weight:700;}
.hubkpis .kpi .label{font-size:14px;color:var(--green);}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;}
.kpi .note{font-size:12px;color:var(--sub);margin-top:4px;}
.up{color:var(--green);font-weight:700;} .dn{color:var(--red);font-weight:700;}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0;}
.panel h2{font-size:15px;margin:0 0 3px;}
.panel .cap{font-size:12.5px;color:var(--sub);margin:0 0 12px;}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin-bottom:16px;}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-bottom:16px;}
.stack{display:flex;flex-direction:column;gap:16px;margin-bottom:16px;}
.chart{width:100%;position:relative;}
.chart svg{display:block;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-bottom:8px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.insights{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.5;}
.insights li{padding-inline-start:16px;position:relative;}
.insights li::before{content:"";position:absolute;inset-inline-start:0;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--blue);}

.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;align-items:center;gap:10px;padding:5px 0;font-size:13px;}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
.hb .tr{height:10px;background:var(--track);border-radius:6px;overflow:hidden;display:flex;gap:2px;}
.hb .tr i{display:block;height:100%;}
.hb .vl{font-variant-numeric:tabular-nums;font-weight:700;text-align:end;font-size:12.5px;white-space:nowrap;}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;}
th,td{padding:8px 10px;text-align:end;white-space:nowrap;border-bottom:1px solid var(--line);}
th{position:sticky;top:0;background:var(--card);color:var(--sub);font-weight:700;font-size:11.5px;z-index:1;}
th:first-child,td:first-child{text-align:start;position:sticky;inset-inline-start:0;background:var(--card);z-index:2;font-weight:600;}
th:first-child{z-index:3;}
th.sortable{cursor:pointer;} th.sortable:hover{color:var(--ink);}
td.l,th.l{text-align:start;}
tr:last-child td{border-bottom:0;}
.heat{min-width:34px;text-align:center;}
.maxh{max-height:560px;overflow:auto;}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px;}
.search{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font-size:13px;min-width:200px;}
.pg{display:inline-block;width:70px;height:7px;background:var(--track);border-radius:5px;overflow:hidden;vertical-align:middle;}
.pg i{display:block;height:100%;}

.sortbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 16px;}
.sortbar .sl{font-size:13px;color:var(--sub);font-weight:600;}
.sortbtn{border:1px solid var(--line);background:var(--card);color:var(--sub);padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;}
.sortbtn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
.hcard .name{display:flex;align-items:center;gap:5px;font-weight:700;font-size:12px;color:var(--sub);}
.hcard .name .pin{width:12px;height:12px;flex:none;}
.hcard .big{font-size:28px;font-weight:800;margin:8px 0 0;}
.hcard .capt{font-size:12.5px;color:var(--green);font-weight:700;}
.bar{height:7px;background:var(--track);border-radius:6px;margin:10px 0 8px;overflow:hidden;}
.bar > i{display:block;height:100%;border-radius:6px;}
.pct-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:2px;gap:6px;flex-wrap:wrap;}
.pct-row b{font-size:15px;}
.miss{color:var(--red);font-weight:700;}
.miss.good{color:var(--green);}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.mini div{background:var(--track);border-radius:8px;padding:8px 10px;}
.mini b{display:block;font-size:15px;}
.mini span{font-size:11px;color:var(--sub);}

#tip{position:fixed;z-index:99;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:240px;display:none;}
#tip b{font-weight:700;}
#tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;}

@media (max-width:820px){
  .nav.subnav{padding:9px 12px;}
  .nav.subnav::before{display:none;}
  .app{grid-template-columns:minmax(0,1fr);}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px 16px;border-inline-end:0;border-bottom:1px solid var(--line);gap:6px;}
  .brand,.navl{display:none;}
  .nav{width:auto;white-space:nowrap;padding:9px 12px;flex:none;}
  .nav .cnt{display:none;}
  .main{padding:20px 16px 50px;}
}
[hidden]{display:none!important}
</style>
</head>

</div>

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function isDate(s){ return typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function dl(iso){ return MON[+iso.slice(5,7)-1]+' '+(+iso.slice(8,10)); }
function nn(v){ if(typeof v==='number') return v; if(v==null) return NaN; const s=String(v).replace(/[,\s%]/g,''); if(s===''||s==='-') return NaN; return Number(s); }
function fin(v){ return typeof v==='number' && isFinite(v); }
function nrm(v){ return String(v==null?'':v).toLowerCase().replace(/\s+/g,''); }
function pctStr(v){ if(typeof v==='number') return Math.round(Math.abs(v)<=1.5? v*100 : v)+'%'; return String(v==null?'':v).trim(); }
function sum(a){ return a.reduce((x,y)=>x+(fin(y)?y:0),0); }
function last(a){ return a[a.length-1]; }

// ================= Parsers (rows = array of arrays) =================
function parseHubs(rows){
  const hi = rows.findIndex(r=>nrm(r[0])==='hubname');
  if(hi<0) throw new Error('hub header not found');
  const head = rows[hi].map(nrm);
  const col = (...names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const ix = {target:col('target'), stars:col('totalstars'), active:col('activestar','activestars'), absence:col('absence'),
    absencePct:col('absence%'), ofd:col('ofd'), ofdPerStar:col('ofd/star'), stdOfd:col('standerdofd','standardofd'), missing:col('missingoftarget')};
  for(const k in ix){ if(ix[k]<0) throw new Error('missing column: '+k); }
  const hubs=[];
  for(const r of rows.slice(hi+1)){
    const name=String(r[0]==null?'':r[0]).trim();
    if(!name) break;
    const target=nn(r[ix.target]); if(!fin(target)) continue;
    const active=nn(r[ix.active]), absence=nn(r[ix.absence]);
    hubs.push({hub:name,target,stars:nn(r[ix.stars]),active,absence,
      absencePct: r[ix.absencePct]!=null && r[ix.absencePct]!=='' ? pctStr(r[ix.absencePct]) : (active? Math.round(absence/active*100)+'%':'0%'),
      ofd:nn(r[ix.ofd]),ofdPerStar:nn(r[ix.ofdPerStar]),stdOfd:nn(r[ix.stdOfd]),missing:nn(r[ix.missing])});
  }
  let totals=null;
  const tr = hi>0 ? rows[hi-1] : null;
  if(tr && fin(nn(tr[ix.target]))){
    totals={target:nn(tr[ix.target]),stars:nn(tr[ix.stars]),active:nn(tr[ix.active]),absence:nn(tr[ix.absence]),
      absencePct:pctStr(tr[ix.absencePct]),ofd:nn(tr[ix.ofd]),ofdPerStar:nn(tr[ix.ofdPerStar]),stdOfd:nn(tr[ix.stdOfd]),missing:nn(tr[ix.missing])};
  } else {
    const s=k=>sum(hubs.map(h=>h[k]));
    totals={target:s('target'),stars:s('stars'),active:s('active'),absence:s('absence'),absencePct:(s('active')?Math.round(s('absence')/s('active')*100):0)+'%',
      ofd:s('ofd'),ofdPerStar:s('stars')?Math.round(s('ofd')/s('stars')):0,stdOfd:hubs.length?Math.round(s('stdOfd')/hubs.length):0,missing:s('missing')};
  }
  if(!hubs.length) throw new Error('no hubs');
  let side={}; try{ side=parseSide(rows); }catch(e){ console.warn('side tables:',e); }
  return {hubs,totals,side};
}
// The three small tables to the right of the main hub table (each starts with a "HUB Name" header)
function parseSide(rows){
  const out=[];
  for(let r=0;r<rows.length;r++){
    const row=rows[r];
    for(let c=10;c<row.length;c++){
      if(nrm(row[c])!=='hubname') continue;
      const names=[]; for(let k=c;k<row.length&&row[k]!=null&&row[k]!=='';k++) names.push(String(row[k]).trim());
      const nv=names.length-1; const hubs=[];
      for(let i=r+1;i<rows.length;i++){ const nm=rows[i][c]; if(nm==null||String(nm).trim()==='') break;
        hubs.push({name:String(nm).trim(),vals:names.slice(1).map((_,j)=>nn(rows[i][c+1+j]))}); }
      const sr=rows[r-1]||[], tr=rows[r-2]||[];
      out.push({title:String(tr[c]||sr[c]||''),cols:names.slice(1),hubs,sumLabel:String(sr[c]||''),sum:names.slice(1).map((_,j)=>nn(sr[c+1+j]))});
    }
  }
  const t1=out.find(t=>t.cols.some(x=>nrm(x)==='ofd/star')), t3=out.find(t=>/stand/i.test(t.title)), t2=out.find(t=>t!==t1&&t!==t3);
  return {ofd:t1,stars:t2,std:t3};
}
function parseSeries(rows){
  const pts=[];
  for(const r of rows){ if(isDate(r[0])){ const v=nn(r[1]); if(fin(v)) pts.push({d:r[0],v}); } }
  if(!pts.length) throw new Error('no data');
  return pts;
}
function parseAcq(rows){
  const hi = rows.findIndex(r=>r.slice(2).some(isDate));
  if(hi<0) throw new Error('date header not found');
  const head=rows[hi]; const cols=[]; head.forEach((c,i)=>{ if(i>=2 && isDate(c)) cols.push(i); });
  const dates=cols.map(i=>head[i]); const hubs=[]; let total=null;
  for(const r of rows.slice(hi+1)){
    const name=String(r[0]==null?'':r[0]).trim(); if(!name) continue;
    const daily=cols.map(i=>{const v=nn(r[i]); return fin(v)?v:0;});
    let month=nn(r[1]); if(!fin(month)) month=sum(daily);
    const rec={name,month,daily};
    if(/^total$/i.test(name)) total=rec; else hubs.push(rec);
  }
  if(!total) total={name:'Total',month:sum(hubs.map(h=>h.month)),daily:dates.map((_,i)=>sum(hubs.map(h=>h.daily[i])))};
  return {dates,total,hubs};
}
function parseDays(rows){
  const hi = rows.findIndex(r=>nrm(r[0])==='hubname');
  if(hi<0) throw new Error('header not found');
  const head=rows[hi]; let cols=[]; head.forEach((c,i)=>{ if(i>=1 && isDate(c)) cols.push(i); });
  const body=[]; for(const r of rows.slice(hi+1)){ const name=String(r[0]==null?'':r[0]).trim(); if(name) body.push({name,r}); }
  cols = cols.filter(i=>body.some(b=>fin(nn(b.r[i]))));
  const top={}; rows.slice(0,hi).forEach(r=>{ const k=nrm(r[0]); if(k) top[k]=cols.map(i=>nn(r[i])); });
  const hubs=body.map(b=>({name:b.name,vals:cols.map(i=>nn(b.r[i]))}));
  if(!cols.length||!hubs.length) throw new Error('no data');
  return {dates:cols.map(i=>head[i]),ofdStar:top['ofd/star']||[],ofd:top['ofd']||[],bosta:top['totalbosta']||[],hubs};
}
function parseTarget(rows){
  const hi = rows.findIndex(r=>nrm(r[0])==='region');
  if(hi<0) throw new Error('header not found');
  const head=rows[hi].map(nrm);
  const ix=(...names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const c={region:ix('region'),sup:ix('superviser','supervisor'),sen:ix('senior'),hub:ix('hubname'),target:ix('taregt','target'),miss:ix('missing'),ofd:ix('ofd/star')};
  if(c.hub<0||c.target<0||c.miss<0) throw new Error('missing columns');
  const hubs=[];
  for(const r of rows.slice(hi+1)){
    const name=String(r[c.hub]==null?'':r[c.hub]).trim(); const t=nn(r[c.target]); if(!name||!fin(t)) continue;
    const m=nn(r[c.miss]);
    hubs.push({hub:name,region:String(r[c.region]||'Other').trim()||'Other',sup:String(r[c.sup]||'-').trim()||'-',sen:String(r[c.sen]||'-').trim()||'-',target:t,missing:fin(m)?m:0,ofd:nn(r[c.ofd])});
  }
  if(!hubs.length) throw new Error('no hubs');

  if(tr0 && fin(nn(tr0[c.target]))) sheetTotal={target:nn(tr0[c.target]),missing:nn(tr0[c.miss])};
  return {hubs,sheetTotal};
}
function parseUrgent(rows){
  const hi = rows.findIndex(r=>nrm(r[2])==='hubname');
  if(hi<0) throw new Error('header not found');
  const head=rows[hi]; let cols=[]; head.forEach((c,i)=>{ if(isDate(c)) cols.push(i); });
  const nh=head.map(nrm); const ti=nh.indexOf('taregt')>=0?nh.indexOf('taregt'):nh.indexOf('target'); const mi=nh.indexOf('missing');
  const hubs=[];
  for(const r of rows.slice(hi+1)){ const name=String(r[2]==null?'':r[2]).trim(); if(!name) continue;
    hubs.push({name,sup:String(r[0]||'-'),sen:String(r[1]||'-'),vals:cols.map(i=>nn(r[i])),target:nn(r[ti]),missing:nn(r[mi])}); }
  cols=cols.filter((_,k)=>hubs.some(h=>fin(h.vals[k])));
  const keep=head.map((c,i)=>i).filter(i=>isDate(head[i]));
  const dates=[]; const idx=[]; keep.forEach((i,k)=>{ if(hubs.some(h=>fin(h.vals[k]))){ dates.push(head[i]); idx.push(k); } });
  hubs.forEach(h=>{ h.vals=idx.map(k=>h.vals[k]); });

function niceTicks(min,max,count=4){
  if(min===max){ max=min+1; }
  const step0=(max-min)/count, mag=Math.pow(10,Math.floor(Math.log10(step0))), nm=step0/mag;
  const step=(nm<1.5?1:nm<3?2:nm<7?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];
  for(let v=lo;v<=hi+step*1e-6;v+=step) t.push(+v.toFixed(8));
  return t;
}
const CH=[];
function chart(type,cfg){ CH.push({type,cfg}); return `<div class="chart" data-i="${CH.length-1}"></div>`; }
function mountCharts(){
  document.querySelectorAll('#page .chart').forEach(el=>{
    const c=CH[+el.dataset.i]; if(!c) return;
    if(c.type==='line') drawLine(el,c.cfg); else drawBars(el,c.cfg);
  });
}
function xlabelIdx(n,iw,minGap=58){ const k=Math.max(1,Math.ceil(minGap/(iw/Math.max(1,n-1||1)))); const out=[]; for(let i=0;i<n;i+=k) out.push(i); return out; }

function drawLine(el,c){
  const W=Math.max(260,el.clientWidth||600), H=c.height||230, m={l:48,r:18,t:16,b:30};
  const n=c.labels.length;
  const vals=c.series.flatMap(s=>s.values.filter(fin));
  let lo=Math.min(...vals), hi=Math.max(...vals); if(c.zero) lo=Math.min(0,lo);
  const ticks=niceTicks(lo,hi); lo=ticks[0]; hi=ticks[ticks.length-1];
  m.l=Math.max(48,14+6.4*Math.max(...ticks.map(t=>(c.fmt||fmt)(t).length)));
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const X=i=>m.l+(n<2?iw/2:i*iw/(n-1)), Y=v=>m.t+ih-(v-lo)/((hi-lo)||1)*ih;
  const f=c.fmt||fmt; let g='';
  ticks.forEach(t=>{ g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)" stroke-width="1"/><text x="${m.l-8}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--sub)">${esc(f(t))}</text>`; });
  xlabelIdx(n,iw).forEach(i=>{ g+=`<text x="${X(i)}" y="${H-9}" text-anchor="middle" font-size="11" fill="var(--sub)">${esc(c.labels[i])}</text>`; });
  c.series.forEach(s=>{
    let d='',open=false;
    s.values.forEach((v,i)=>{ if(fin(v)){ d+=(open?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1); open=true; } else open=false; });
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"${s.dashed?' stroke-dasharray="6 5"':''}/>`;
    if(!s.dashed && n<=24) s.values.forEach((v,i)=>{ if(fin(v)) g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${s.color}" stroke="var(--card)" stroke-width="1.5"/>`; });
  });
  const ls=c.series.find(s=>!s.dashed)||c.series[0]; let li=-1; ls.values.forEach((v,i)=>{ if(fin(v)) li=i; });
  if(li>=0 && c.endLabel!==false){ g+=`<text x="${Math.min(X(li),W-m.r)}" y="${Y(ls.values[li])-12}" text-anchor="${li>n-3?'end':'middle'}" font-size="12" font-weight="700" fill="var(--ink)" stroke="var(--card)" stroke-width="3" paint-order="stroke">${esc(f(ls.values[li]))}</text>`; }
  g+=`<line id="cx" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--sub)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||'chart')}">${g}<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  const svg=el.querySelector('svg'), cx=svg.querySelector('#cx');
  const move=ev=>{
    const r=svg.getBoundingClientRect(), p=(ev.touches?ev.touches[0]:ev);
    const i=Math.max(0,Math.min(n-1,Math.round((p.clientX-r.left-m.l)/(iw||1)*(n-1))));
    cx.setAttribute('x1',X(i)); cx.setAttribute('x2',X(i)); cx.setAttribute('visibility','visible');
    let h=`<b>${esc(c.labels[i])}</b>`;
    c.series.forEach(s=>{ if(fin(s.values[i])) h+=`<br><i style="background:${s.color}"></i>${esc(s.name)}: <b>${esc(f(s.values[i]))}</b>`; });
    showTip(h,p.clientX,p.clientY);
  };
  svg.addEventListener('mousemove',move); svg.addEventListener('touchstart',move,{passive:true}); svg.addEventListener('touchmove',move,{passive:true});
  svg.addEventListener('mouseleave',()=>{ cx.setAttribute('visibility','hidden'); hideTip(); });
}

function drawBars(el,c){
  const W=Math.max(260,el.clientWidth||600), H=c.height||230, m={l:48,r:12,t:20,b:30};
  const n=c.labels.length, f=c.fmt||fmt;
  const vv=c.values.filter(fin); let lo=Math.min(0,...vv), hi=Math.max(0,...vv);
  const ticks=niceTicks(lo,hi); lo=ticks[0]; hi=ticks[ticks.length-1];
  m.l=Math.max(48,14+6.4*Math.max(...ticks.map(t=>f(t).length)));
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const Y=v=>m.t+ih-(v-lo)/((hi-lo)||1)*ih, band=iw/n, bw=Math.min(band*0.64,36);
  let g='';
  ticks.forEach(t=>{ g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t===0?'var(--sub)':'var(--grid)'}" stroke-width="1"/><text x="${m.l-8}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--sub)">${esc(f(t))}</text>`; });
  const labIdx=new Set(xlabelIdx(n,iw,Math.max(40,band)).map(i=>i));
  c.values.forEach((v,i)=>{
    const x=m.l+band*i+(band-bw)/2;
    if(labIdx.has(i)||n<=16) g+=`<text x="${x+bw/2}" y="${H-9}" text-anchor="middle" font-size="11" fill="var(--sub)">${esc(c.labels[i])}</text>`;
    if(!fin(v)) return;
    const col=c.colorFn?c.colorFn(v,i):c.color, y0=Y(0), y1=Y(v), top=Math.min(y0,y1), h=Math.max(2,Math.abs(y0-y1));
    g+=`<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="3" fill="${col}" data-tip="<b>${esc(c.labels[i])}</b><br>${esc(c.name||'Value')}: <b>${esc(f(v))}</b>"/>`;
    if(n<=14 && bw>=18) g+=`<text x="${x+bw/2}" y="${(v>=0?top-5:top+h+13)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${esc(f(v))}</text>`;
  });
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||'chart')}">${g}</svg>`;
}
let _rs; addEventListener('resize',()=>{ clearTimeout(_rs); _rs=setTimeout(mountCharts,120); });

function spark(vals,w=84,h=24,color='var(--blue)'){
  const v=vals.filter(fin); if(v.length<2) return '';
  const lo=Math.min(...v), hi=Math.max(...v), n=vals.length; let d='';
  vals.forEach((x,i)=>{ if(!fin(x)) return; const px=2+i*(w-4)/(n-1), py=h-3-(x-lo)/((hi-lo)||1)*(h-6); d+=(d?'L':'M')+px.toFixed(1)+' '+py.toFixed(1); });
  const lv=last(v), lx=w-2, ly=h-3-(lv-lo)/((hi-lo)||1)*(h-6);
  return `<svg width="${w}" height="${h}" style="vertical-align:middle"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${lx}" cy="${ly}" r="2.4" fill="${color}"/></svg>`;
}
function hbars(items,{fmtv=fmt,color='var(--blue)',max}={}){
  const mx=max||Math.max(1,...items.map(i=>i.v));
  return items.map(i=>`<div class="hb" data-tip="<b>${esc(i.label)}</b><br>${esc(fmtv(i.v))}"><div class="nm">${esc(i.label)}</div><div class="tr"><i style="width:${Math.max(1.5,i.v/mx*100)}%;background:${i.color||color};border-radius:6px"></i></div><div class="vl">${esc(i.text||fmtv(i.v))}</div></div>`).join('');
}
function kpi(label,val,note,c='var(--blue)'){ return `<div class="kpi" style="--c:${c}"><div class="label">${esc(label)}</div><div class="val">${val}</div>${note?`<div class="note">${note}</div>`:''}</div>`; }
function insights(list){ return `<div class="panel"><h2>Key insights</h2><p class="cap">Generated automatically from the sheet</p><ul class="insights">${list.map(x=>`<li>${x}</li>`).join('')}</ul></div>`; }
function heatCell(v,lo,hi,txt){ if(!fin(v)) return '<td class="heat" style="color:var(--sub)">–</td>'; const t=hi>lo?(v-lo)/(hi-lo):0.5; return `<td class="heat" style="background:rgba(var(--heat),${(0.06+0.5*t).toFixed(2)})">${esc(txt!=null?txt:fmt(v))}</td>`; }

function findSheet(wb,p,idx){
  const names=Object.keys(wb); const want=nrm(p.sheet);
  const k=names.find(n=>nrm(n)===want);
  return wb[k!=null?k:names[idx]];
}
const PARSERS = {hubs:parseHubs,bosta:parseSeries,acq:parseAcq,days:parseDays,target:parseTarget,urgent:parseUrgent,attr:parseSeries};
function applyWorkbook(wb){
  WB=wb;
  PAGES.forEach((p,i)=>{
    try{ const rows=findSheet(wb,p,i); if(!rows) throw new Error('tab not found'); MODEL[p.key]=PARSERS[p.key](rows); delete errs[p.key]; }
    catch(e){ errs[p.key]=String(e&&e.message||e); console.warn('Tab "'+p.sheet+'":',e); }
  });
  if(MODEL.hubs) setHubs(MODEL.hubs.hubs,MODEL.hubs.totals);
  renderNav(); renderPage();
}

function setSubtitle(t){ document.getElementById('subtitle').textContent=t; }
function stamp(){ return isLive && lastUpdate ? 'Updated '+lastUpdate.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : 'Saved snapshot'; }
function renderPage(){
  CH.length=0; hideTip();

    host.innerHTML={ofd:pgSideOfd,stars:pgSideStars,std:pgSideStd}[sub.m](t,MODEL.hubs.side);

  const fn={hubs:pgHubs,bosta:pgBosta,acq:pgAcq,days:pgDays,target:pgTarget,urgent:pgUrgent,attr:pgAttr}[current];

  mountCharts();

}

// ---- Hubs ----
function ofdColor(val,mn=ofdMin,mx=ofdMax){ const t=(val-mn)/((mx-mn)||1); const hue=(1-t)*120; return {bg:`hsl(${hue},70%,90%)`,fg:`hsl(${hue},65%,28%)`}; }
function hcard(d){
  const missing=d.target-d.active, activePct=d.target?Math.round(d.active/d.target*1000)/10:0;
  const bw=Math.min(Math.max(activePct,0),100), bc=activePct>=80?'var(--green)':activePct>=50?'var(--orange)':'var(--red)';
  const c=ofdColor(d.ofdPerStar);
  return `<div class="hcard">
    <div class="name"><svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${esc(d.hub)}</div>
    <div class="big">${fmt(d.active)}</div><div class="capt">Active stars</div>
    <div class="pct-row"><b>Target ${fmt(d.target)}</b><span class="miss ${missing<=0?'good':''}">${missing>0?'-'+fmt(missing)+' missing':'Target exceeded'}</span></div>
    <div class="bar"><i style="width:${bw}%;background:${bc}"></i></div>
    <div class="mini">
      <div><b>${fmt(d.stars)}</b><span>Total stars</span></div>
      <div><b>${fmt(d.ofd)}</b><span>OFD</span></div>
      <div><b>${fmt(d.absence)}</b><span>Absence &bull; ${esc(d.absencePct)}</span></div>
      <div style="background:${c.bg};color:${c.fg}"><b style="color:${c.fg}">${fmt(d.ofdPerStar)}</b><span style="color:${c.fg}">OFD/Star</span></div>
    </div></div>`;
}
function setHubs(hubs,totals){
  D=hubs.map(d=>({...d})); TOTALS=totals;
  ofdMin=Math.min(...D.map(d=>d.ofdPerStar)); ofdMax=Math.max(...D.map(d=>d.ofdPerStar));
  kpis=[{label:'Target',val:fmt(TOTALS.target),c:'#2f5ee0'},{label:'Total stars',val:fmt(TOTALS.stars),c:'#333333'},{label:'Active Star',val:fmt(TOTALS.active),c:'#2f5ee0'},
    {label:'absence',val:fmt(TOTALS.absence),c:'#e08a1f'},{label:'absence %',val:TOTALS.absencePct,c:'#e08a1f'},{label:'OFD',val:fmt(TOTALS.ofd),c:'#1a9c6b'},
    {label:'OFD/Star',val:fmt(TOTALS.ofdPerStar),c:'#d1394a'},{label:'Standerd OFD',val:fmt(TOTALS.stdOfd),c:'#333333'},{label:'Missing of target',val:fmt(TOTALS.missing),c:'#d1394a'}];
  sortHubs();
}
function sortHubs(){ const a=[...D]; if(sortMode==='ofd') a.sort((x,y)=>y.ofdPerStar-x.ofdPerStar); else a.sort((x,y)=>(y.target-y.active)-(x.target-x.active)); currentSorted=a; }
function pgHubs(){
  sortHubs();
  const overall=TOTALS.target?Math.round(TOTALS.stars/TOTALS.target*1000)/10:0;
  setSubtitle(`${D.length} hubs • Overall achievement ${overall}% • ${stamp()}`);
  return `<div class="kpis hubkpis">${kpis.map(k=>`<div class="kpi" style="--c:${k.c}"><div class="label">${esc(k.label)}</div><div class="val">${esc(k.val)}</div></div>`).join('')}</div>

    <button class="sortbtn${sortMode==='ofd'?' active':''}" data-sort="ofd">Highest OFD/Star</button>
    <button class="sortbtn${sortMode==='missing'?' active':''}" data-sort="missing">Highest Missing</button></div>
  <div class="cards">${currentSorted.map(hcard).join('')}</div>`;
}

const ST={}, SIDE_T={};
function sTable(key,cols,rows,defK,defDir){

  SIDE_T[key]={cols,rows};
  return `<div class="panel" style="margin-top:16px"><h2>All hubs</h2><p class="cap">Click a column to sort</p>

    <div class="tw maxh"><table><thead id="sh"></thead><tbody id="sb"></tbody></table></div></div>`;
}
function mountSide(key){
  const T=SIDE_T[key]; if(!T) return; const st=ST[key];
  const draw=()=>{
    const q=st.q.trim().toLowerCase();
    const list=T.rows.filter(r=>!q||r.name.toLowerCase().includes(q)).sort((a,b)=>{ const x=a[st.k],y=b[st.k]; return (typeof x==='string'?x.localeCompare(y):(x-y))*st.dir; });
    document.getElementById('sh').innerHTML='<tr>'+T.cols.map(c=>`<th class="sortable${c.l?' l':''}" data-k="${c.k}">${esc(c.label)}${st.k===c.k?(st.dir<0?' \u25BE':' \u25B4'):''}</th>`).join('')+'</tr>';
    document.getElementById('sb').innerHTML=list.map(r=>'<tr>'+T.cols.map(c=>c.td?c.td(r):`<td${c.l?' class="l"':''}>${esc(r[c.k])}</td>`).join('')+'</tr>').join('')||'<tr><td class="l" colspan="9">No hubs match</td></tr>';
  };
  draw();
  document.getElementById('sh').addEventListener('click',e=>{ const th=e.target.closest('th[data-k]'); if(!th) return; const k=th.dataset.k; if(st.k===k) st.dir*=-1; else{ st.k=k; st.dir=k==='name'?1:-1; } draw(); });
  document.getElementById('sq').addEventListener('input',e=>{ st.q=e.target.value; draw(); });
}
function bucketBars(vals,edges,labels){ const c=labels.map(()=>0); vals.forEach(v=>{ let i=edges.findIndex(e=>v<e); if(i<0) i=labels.length-1; c[i]++; }); return c; }
function pgSideOfd(t){
  const iO=t.cols.findIndex(c=>nrm(c)==='ofd'), iA=t.cols.findIndex(c=>nrm(c)==='activestar'), iR=t.cols.findIndex(c=>nrm(c)==='ofd/star');
  const rows=t.hubs.map(h=>({name:h.name,ofd:h.vals[iO],active:h.vals[iA],ops:h.vals[iR]})).filter(r=>fin(r.ofd)&&fin(r.ops));
  const TO=sum(rows.map(r=>r.ofd)), TA=sum(rows.map(r=>r.active)), ratio=TO/TA;
  rows.forEach(r=>{ r.share=r.ofd/TO*100; });
  const mn=Math.min(...rows.map(r=>r.ops)), mx=Math.max(...rows.map(r=>r.ops));
  const byO=[...rows].sort((a,b)=>b.ops-a.ops), top=byO.slice(0,10), bot=byO.slice(-10).reverse();
  const sh5=sum([...rows].sort((a,b)=>b.ofd-a.ofd).slice(0,5).map(r=>r.share)), under30=rows.filter(r=>r.ops<30).length, over45=rows.filter(r=>r.ops>=45).length;
  const sheetOps=t.sum[iR];
  setSubtitle(`${rows.length} hubs \u2022 OFD, active stars and OFD per star \u2022 ${stamp()}`);
  const edges=[25,30,35,40,45,50], labels=['<25','25\u201329','30\u201334','35\u201339','40\u201344','45\u201349','50+'];
  const cnt=bucketBars(rows.map(r=>r.ops),edges,labels);
  return `<div class="kpis">
    ${kpi('Total OFD',fmt(TO),rows.length+' hubs','var(--green)')}
    ${kpi('Active stars',fmt(TA),'sum of hubs','var(--blue)')}
    ${kpi('OFD / Star',ratio.toFixed(1),'OFD \u00F7 active stars'+(fin(sheetOps)?' \u2022 sheet shows '+fmt(sheetOps):''),'var(--red)')}
    ${kpi('Highest',fmt(top[0].ops),esc(top[0].name),'var(--orange)')}
    ${kpi('Lowest',fmt(bot[0].ops),esc(bot[0].name),'var(--sub)')}</div>
  <div class="grid2">
    <div class="panel"><h2>Highest OFD/Star</h2><p class="cap">Top 10 hubs</p>${hbars(top.map(r=>({label:r.name,v:r.ops,color:'var(--green)'})),{max:mx})}</div>
    <div class="panel"><h2>Lowest OFD/Star</h2><p class="cap">Bottom 10 hubs</p>${hbars(bot.map(r=>({label:r.name,v:r.ops,color:'var(--red)'})),{max:mx})}</div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>How hubs are spread</h2><p class="cap">Number of hubs per OFD/Star range</p>${chart('bars',{labels,values:cnt,name:'Hubs',color:'var(--blue)',height:230,title:'Distribution of OFD per star'})}</div>
    ${insights([

function pgSideStd(t,side){

// ---- Total Bosta ----

  </div>
  ${insights([

// ---- ACQ Trend ----
function pgAcq(m){
  const t=m.total, n=m.dates.length, lastV=t.daily[n-1], avg=t.month/n;
  const bi=t.daily.indexOf(Math.max(...t.daily));
  const hubs=[...m.hubs].sort((a,b)=>b.month-a.month);
  const active=hubs.filter(h=>h.month>0).length, quiet=hubs.filter(h=>h.daily[n-1]===0).length;
  setSubtitle(`New stars acquired • ${dl(m.dates[0])} – ${dl(m.dates[n-1])} • ${stamp()}`);

// ---- Target ----
const TG={sort:'missing',dir:-1,q:''};
function groupBy(hubs,key){
  const map=new Map();
  hubs.forEach(h=>{ const k=h[key]; if(!map.has(k)) map.set(k,{label:k,target:0,missing:0,hubs:0}); const g=map.get(k); g.target+=h.target; g.missing+=h.missing; g.hubs++; });
  return [...map.values()].sort((a,b)=>b.missing-a.missing);
}
function sbars(groups){
  return groups.map(g=>{ const ach=g.target-g.missing, p=g.target?Math.max(0,Math.min(100,ach/g.target*100)):0;
    return `<div class="hb" data-tip="<b>${esc(g.label)}</b><br>Target ${fmt(g.target)}<br>Achieved ${fmt(ach)} (${p.toFixed(0)}%)<br>Missing ${fmt(g.missing)}<br>${g.hubs} hubs"><div class="nm">${esc(g.label)}</div><div class="tr"><i style="width:${p}%;background:var(--green)"></i><i style="width:${100-p}%;background:var(--red);opacity:.55"></i></div><div class="vl">${p.toFixed(0)}% • <span class="dn">−${fmt(g.missing)}</span></div></div>`; }).join('');
}
function pgTarget(m){
  const hubs=m.hubs, T=sum(hubs.map(h=>h.target)), M=sum(hubs.map(h=>h.missing)), A=T-M, pct=A/T*100;
  setSubtitle(`${hubs.length} hubs • Achievement ${pct.toFixed(1)}% • ${stamp()}`);
  const byR=groupBy(hubs,'region'), byS=groupBy(hubs,'sup'), byN=groupBy(hubs,'sen');
  const topGap=[...hubs].sort((a,b)=>b.missing-a.missing).slice(0,10).map(h=>({label:h.hub,v:h.missing,color:'var(--red)'}));
  const legend=`<div class="legend"><span><i style="background:var(--green)"></i>Achieved</span><span><i style="background:var(--red);opacity:.55"></i>Missing</span></div>`;
  const worstR=[...byR].sort((a,b)=>(a.target-a.missing)/a.target-(b.target-b.missing)/b.target)[0];
  const st=m.sheetTotal, mism=st&&(st.target!==T||st.missing!==M);
  return `<div class="kpis">
    ${kpi('Target',fmt(T),hubs.length+' hubs','var(--blue)')}
    ${kpi('Achieved',fmt(A),pct.toFixed(1)+'% of target','var(--green)')}
    ${kpi('Missing',fmt(M),(M/T*100).toFixed(1)+'% of target','var(--red)')}
    ${kpi('Avg gap / hub',(M/hubs.length).toFixed(1),'stars per hub','var(--orange)')}</div>
  ${mism?`<div class="panel" style="margin-bottom:16px;border-color:var(--orange)"><p class="cap" style="margin:0"><b style="color:var(--orange)">Data note:</b> the sheet\u2019s Total row shows target ${fmt(st.target)} / missing ${fmt(st.missing)}, but the ${hubs.length} hubs listed add up to ${fmt(T)} / ${fmt(M)}. This page uses the hub rows.</p></div>`:''}
  <div class="grid3">
    <div class="panel"><h2>By region</h2><p class="cap">Share of target reached</p>${legend}${sbars(byR)}</div>
    <div class="panel"><h2>By supervisor</h2><p class="cap">Share of target reached</p>${legend}${sbars(byS)}</div>
    <div class="panel"><h2>By senior</h2><p class="cap">Share of target reached</p>${legend}${sbars(byN)}</div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>Biggest gaps</h2><p class="cap">Top 10 hubs by missing stars</p>${hbars(topGap,{color:'var(--red)'})}</div>
    ${insights([
      `Overall <b>${fmt(A)}</b> of <b>${fmt(T)}</b> target stars are in place (<b>${pct.toFixed(1)}%</b>); <b>${fmt(M)}</b> still missing.`,
      `Largest gap: <b>${esc(topGap[0].label)}</b> (−${fmt(topGap[0].v)}), then ${esc(topGap[1].label)} (−${topGap[1].v}) and ${esc(topGap[2].label)} (−${topGap[2].v}).`,
      `Region furthest from target: <b>${esc(worstR.label)}</b> at ${((worstR.target-worstR.missing)/worstR.target*100).toFixed(0)}%.`,
      `Top 10 gaps add up to ${fmt(sum(topGap.map(g=>g.v)))} stars – ${(sum(topGap.map(g=>g.v))/M*100).toFixed(0)}% of everything missing.`])}
  </div>
  <div class="panel"><h2>All hubs</h2><p class="cap">Click a column to sort</p>
    <div class="tools"><input class="search" id="tq" placeholder="Search hub, region, supervisor…" value="${esc(TG.q)}"></div>
    <div class="tw maxh"><table><thead id="tgh"></thead><tbody id="tgb"></tbody></table></div></div>`;
}
function mountTarget(){
  const hubs=MODEL.target.hubs;
  const cols=[['hub','Hub',1],['region','Region',1],['sup','Supervisor',1],['sen','Senior',1],['target','Target'],['missing','Missing'],['pct','Achieved'],['ofd','OFD/Star']];
  const draw=()=>{
    const q=TG.q.trim().toLowerCase();
    let list=hubs.map(h=>({...h,pct:h.target?(h.target-h.missing)/h.target*100:0})).filter(h=>!q||[h.hub,h.region,h.sup,h.sen].some(s=>String(s).toLowerCase().includes(q)));
    list.sort((a,b)=>{ const x=a[TG.sort],y=b[TG.sort]; return (typeof x==='string'?x.localeCompare(y):(x-y))*TG.dir; });

// Convert an xlsx file (base64) to {tabName: rows[][]}
function xlsxToWorkbook(b64,type){
  if(typeof XLSX==='undefined') throw new Error('spreadsheet reader did not load');
  const book=XLSX.read(b64,{type:type||'base64'}); const out={};
  book.SheetNames.forEach(name=>{
    const ws=book.Sheets[name]; if(!ws['!ref']){ out[name]=[]; return; }
    const rg=XLSX.utils.decode_range(ws['!ref']); const rows=[];
    for(let r=rg.s.r;r<=rg.e.r;r++){
      const row=[];
      for(let c=rg.s.c;c<=rg.e.c;c++){
        const cell=ws[XLSX.utils.encode_cell({r,c})]; let v=null;
        if(cell && cell.v!=null){
          if(cell.t==='n' && cell.z && XLSX.SSF.is_date(cell.z)){ const d=XLSX.SSF.parse_date_code(cell.v); v=d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0'); }
          else if(cell.t==='e') v=null; else v=cell.v;
        }
        row.push(v);
      }
      while(row.length && row[row.length-1]==null) row.pop();
      rows.push(row);
    }
    while(rows.length && !rows[rows.length-1].length) rows.pop();
    out[name]=rows;
  });
  return out;
}
function extractB64(p){
  if(p && typeof p==='object'){ if(typeof p.content==='string') return p.content; if(Array.isArray(p.content)){ const t=p.content.find(x=>x&&typeof x.text==='string'); if(t) return extractB64(t.text); } }
  if(typeof p==='string'){ const s=p.trim(); if(s.startsWith('{')){ try{ return extractB64(JSON.parse(s)); }catch(e){} } return s; }
  return '';
}

// Path B: read each tab from Google over the web (hosted page / local file)
function gvizDate(v){ const m=/^Date\((\d+),(\d+),(\d+)/.exec(v); return m? m[1]+'-'+String(+m[2]+1).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0') : v; }
function respToRows(resp){
  if(!resp||resp.status!=='ok'||!resp.table){ const er=resp&&resp.errors&&resp.errors[0]; const msg=er?String(er.reason||'')+' '+String(er.message||''):'bad response'; throw new Error(/access|denied|permission|sign/i.test(msg)?'HTTP 403':'bad response: '+msg); }
  const rows=(resp.table.rows||[]).map(r=>{ const row=(r.c||[]).map(cell=>{ if(!cell||cell.v==null) return null; return typeof cell.v==='string'?gvizDate(cell.v):cell.v; }); while(row.length&&row[row.length-1]==null) row.pop(); return row; });
  while(rows.length&&!rows[rows.length-1].length) rows.pop();
  return rows;
}
function gvizUrl(name,extra){ return 'https://docs.google.com/spreadsheets/d/'+DRIVE_FILE_ID+'/gviz/tq?sheet='+encodeURIComponent(name)+'&headers=0&tqx='+extra+'&_='+Date.now(); }
async function loadTabFetch(name){
  const res=await fetch(gvizUrl(name,'out:json'),{cache:'no-store',credentials:'omit'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const t=await res.text(); const i=t.indexOf('{'), j=t.lastIndexOf('}');
  if(i<0||j<i) throw new Error('bad response');
  return respToRows(JSON.parse(t.slice(i,j+1)));
}
async function loadTab(name){ try{ return await loadTabFetch(name); }catch(e1){ try{ return await loadTabJsonp(name); }catch(e2){ throw e1; } } }
function loadTabJsonp(name){
  return new Promise((resolve,reject)=>{
    const cb='__gv'+Date.now()+Math.floor(Math.random()*1e6), s=document.createElement('script'); let done=false,timer=null;
    const cleanup=()=>{ done=true; clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } s.remove(); };
    timer=setTimeout(()=>{ if(!done){ cleanup(); reject(new Error('timeout')); } },10000);
    window[cb]=resp=>{ if(done) return; cleanup(); try{ resolve(respToRows(resp)); }catch(e){ reject(e); } };
    s.onerror=()=>{ if(!done){ cleanup(); reject(new Error('script blocked')); } };
    s.src=gvizUrl(name,'out:json;responseHandler:'+cb);
    document.head.appendChild(s);
  });
}
async function fetchText(url){ const res=await fetch(url,{cache:'no-store'}); if(!res.ok) throw new Error('HTTP '+res.status); return res.text(); }
function parseCSV(text){
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true; else if(ch===','){ row.push(cell); cell=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); cell=''; rows.push(row); row=[]; }
    else cell+=ch; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.map(r=>{ r=r.map(c=>c===''?null:c); while(r.length&&r[r.length-1]==null) r.pop(); return r; });
}
function whyFailed(es){
  if(es.some(e=>/^HTTP (401|403|404)/.test(e))) return 'Google refused access \u2013 in the sheet press Share and set \u201CAnyone with the link\u201D to Viewer';
  if(es.every(e=>/Failed to fetch|script blocked|timeout|NetworkError|Load failed/i.test(e))) return 'could not reach the published link (blocked network, or opened inside claude.ai which blocks it) \u2013 host the file on your own site';
  return 'unexpected answer from Google';
}
function csvDates(rows){ return rows.map(r=>r.map(c=>{ if(typeof c!=='string') return c; const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(c.trim()); return m? m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0') : c; })); }
async function loadPubXlsx(){

}
async function loadWeb(){
  if(loading) return; loading=true; if(!isLive) setStatus('loading');
  const es=[];
  try{
    const first=PAGES[0].sheet, names=PAGES.map(p=>p.sheet);
    // 0) live read of every tab straight from the sheet (always fresh, no publish delay; needs "Anyone with the link can view")
    const res=await Promise.allSettled(names.map(nm=>loadTab(nm)));
    const wb={}; let ok=0;
    res.forEach((r,i)=>{ if(r.status==='fulfilled'&&r.value.length){ wb[names[i]]=r.value; ok++; } else if(r.status==='rejected') es.push(String(r.reason&&r.reason.message||r.reason)); });
    if(ok===names.length){ acceptWorkbook({...WB,...wb},null,'live'); return; }
    // 1) the published link as xlsx: every tab, straight from the link you gave
    try{ const x=await loadPubXlsx(); acceptWorkbook({...WB,...x,...wb},null,'published link (may lag a few minutes)'); return; }
    catch(e){ es.push(String(e&&e.message||e)); }

    // 2) the same link as CSV (first tab only)

function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fitText(ctx,text,maxWidth){ if(ctx.measureText(text).width<=maxWidth) return text; let t=text; while(t.length>1&&ctx.measureText(t+'…').width>maxWidth) t=t.slice(0,-1); return t+'…'; }
function drawPinIcon(ctx,cx,cy,r,color){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=Math.max(1.2,r*0.22); ctx.lineJoin='round'; ctx.lineCap='round';
  const gap=44*Math.PI/180, a1=Math.PI/2+gap/2, a2=Math.PI/2-gap/2;
  const p2={x:cx+r*Math.cos(a2),y:cy+r*Math.sin(a2)}, tip={x:cx,y:cy+r*2.15};
  ctx.beginPath(); ctx.arc(cx,cy,r,a1,a2,false); ctx.lineTo(tip.x,tip.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,r*0.36,0,Math.PI*2); ctx.stroke(); ctx.restore();
}
function drawCard(ctx,d,x,y,w,h){

  py+=40; ctx.fillStyle='#1c1f26'; ctx.font='800 32px Segoe UI, Arial'; ctx.fillText(fmt(d.active),px,py);

  py=barY+34; const miniW=(w-36-10)/2, miniH=52, oc=ofdColor(d.ofdPerStar);

  btn.disabled=true; btn.textContent='Preparing...';
  try{
    const blob=await buildImageBlob(); let saved=false;
    try{ if(typeof claude!=='undefined'&&claude.use){ const downloads=await claude.use('downloads'); if(downloads){ btn.textContent='Saving...'; await downloads.save({filename:'hubs-dashboard.png',data:blob}); saved=true; } } }catch(e){}
    if(!saved){ const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download='hubs-dashboard.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); }
  }catch(e){ console.error(e); alert('Could not generate the image. Please try again.'); }
  finally{ btn.disabled=false; btn.textContent=original; }
});

// ================= Start =================
(function(){ const h=(location.hash||'').slice(1); if(PAGES.some(p=>p.key===h)||SUBS.some(x=>x.key===h)) current=h; })();
applyWorkbook(SNAPSHOT_WB);
(function(){ const l=loadLast(); if(l){ try{ applyWorkbook({...SNAPSHOT_WB,...l.wb}); lastRaw=JSON.stringify({...SNAPSHOT_WB,...l.wb}); setStatus('loading','last saved '+new Date(l.t).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})); }catch(e){} } })();
loadWeb();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) loadWeb(); });
setInterval(()=>{ if(!document.hidden) loadWeb(); },REFRESH_MS);

</script>
